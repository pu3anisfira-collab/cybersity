/* ---------- Content helpers ---------- */
const ALL_LESSONS = MODULES.flatMap((m,mi)=> m.lessons.map((l,li)=>({...l, mod:m, mi, li})));
const lessonById = id => ALL_LESSONS.find(l=>l.id===id);
const modById = id => MODULES.find(m=>m.id===id);
const prog = id => (S.lessons[id] ||= {});
const lessonDone = id => !!(S.lessons[id] && S.lessons[id].quiz);
const modPassed = m => !!(S.modules[m.id] && S.modules[m.id].passed);
function modUnlocked(m){ const i = MODULES.indexOf(m); return i===0 || modPassed(MODULES[i-1]); }
function lessonUnlocked(l){ if (!modUnlocked(l.mod)) return false; if (l.li===0) return true; return lessonDone(l.mod.lessons[l.li-1].id); }
const modLessonsDone = m => m.lessons.every(l=>lessonDone(l.id));
const allModsPassed = () => MODULES.every(modPassed);
const finalPassed = () => !!(S.final && S.final.passed);
function modProgress(m){ let done=0, total=m.lessons.length*3+1; m.lessons.forEach(l=>{ const p=S.lessons[l.id]||{}; done += (p.read?1:0)+(p.activity?1:0)+(p.quiz?1:0); }); if (modPassed(m)) done++; return done/total; }
function overallProgress(){ let t=0; MODULES.forEach(m=>t+=modProgress(m)); return Math.round((t/MODULES.length)*90 + (finalPassed()?10:0)); }
function levelInfo(xp=S.xp){ let i=0; LEVELS.forEach((L,k)=>{ if (xp>=L.xp) i=k; }); const cur=LEVELS[i], nxt=LEVELS[i+1]; return { n:i+1, t:cur.t, cur:cur.xp, next:nxt?nxt.xp:null, pct: nxt ? (xp-cur.xp)/(nxt.xp-cur.xp) : 1 }; }

function nextStep(){
  for (const m of MODULES){
    if (!modUnlocked(m)) break;
    for (const raw of m.lessons){
      const l = lessonById(raw.id);
      if (!lessonUnlocked(l)) break;
      const p = S.lessons[l.id]||{};
      if (!p.read) return {label:`Lesson ${m.n}.${l.li+1}: ${l.title}`, sub:'Continue the lesson', act:'openLesson', arg:l.id+'|0'};
      if (!p.activity) return {label:l.activity.title, sub:`Practice activity · Lesson ${m.n}.${l.li+1}`, act:'openLesson', arg:l.id+'|5'};
      if (!p.quiz) return {label:`Lesson ${m.n}.${l.li+1} quiz`, sub:l.title, act:'openLesson', arg:l.id+'|6'};
    }
    if (modLessonsDone(m) && !modPassed(m)) return {label:`Module ${m.n} assessment`, sub:m.title, act:'startModule', arg:m.id};
  }
  if (allModsPassed() && !finalPassed()) return {label:'Final assessment', sub:'Cybersecurity Fundamentals', act:'startFinal'};
  return {label:'View your certificate', sub:'Programme complete', act:'go', arg:'certificate'};
}

const modalQueue = [];

function openNextModal(){

function log(txt, xp=0){ S.history.unshift({t:Date.now(), txt, xp}); S.history = S.history.slice(0,60); }
function addXP(n, why){
  const before = levelInfo().n; S.xp += n; log(why, n); save();
  toast(`+${n} XP`, 'xp'); sfx('coin'); updateHUD();
  if (!/^(Quest complete|All daily)/.test(why)) addCoins(Math.max(1, Math.round(n/5))); // 1 coin per 5 XP (quests pay coins separately)

  if (after.n > before){ sfx('win'); flyTo('LEVEL UP!', '.hud .player-chip'); } if (after.n > before) showModal(`<div class="label" style="color:var(--gold-ink)">Level up!</div><div class="level-num" style="margin:14px auto">${after.n}</div><h2>${esc(after.t)}</h2><p class="muted">You reached level ${after.n}. Keep learning to unlock the next rank.</p><div class="actions"><button class="btn gold" data-act="closeModal">Awesome</button></div>`);
}

async function bindHashDemo(){
  const inp = $('#hashIn'), out = $('#hashOut'); if (!inp) return;
  const run = async ()=>{ try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(inp.value)); out.textContent = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); } catch(e){ out.textContent = 'Hashing is not available in this browser preview.'; } };
  inp.addEventListener('input', run); run();
}

/* ---------- Quiz engine (lesson, module, final) ---------- */
function prepQ(q){ const order = shuffle(q.o.map((_,i)=>i)); return { q:q.q, o:order.map(i=>q.o[i]), a:order.indexOf(q.a), e:q.e }; }
function startQuiz(kind, id){
  let qs, title, back;
  if (kind==='lesson'){ const l=lessonById(id); qs=l.quiz.map(prepQ); title=`Lesson ${l.mod.n}.${l.li+1} quiz · ${l.title}`; }
  if (kind==='module'){ const m=modById(id); qs=shuffle([...m.lessons.flatMap(l=>l.quiz), ...m.extra]).map(prepQ); title=`Module ${m.n} assessment · ${m.title}`; }
  if (kind==='final'){ qs=shuffle(MODULES.flatMap(m=> shuffle([...m.lessons.flatMap(l=>l.quiz), ...m.extra]).slice(0,2))).map(prepQ); title='Final assessment · Cybersecurity Fundamentals'; }
  UI.quiz = { kind, id, qs, idx:0, ans:[], picked:null, title, done:false };
  go('quiz');
}

function finishQuiz(){
  const Q = UI.quiz, score = Math.round(Q.ans.filter(Boolean).length / Q.qs.length * 100), pass = score >= S.passMark;
  Q.score = score; Q.pass = pass; Q.done = true;
  S.attempts.unshift({kind:Q.kind, id:Q.id||'final', score, pass, at:Date.now()}); S.attempts = S.attempts.slice(0,50);
  const rewards = [];
  if (Q.kind==='lesson'){ const p=prog(Q.id), l=lessonById(Q.id); const first = pass && !p.quiz; p.quizBest = Math.max(p.quizBest||0, score); if (pass) p.quiz = true; save();
    if (first){ rewards.push(()=>addXP(XP.quiz, `Passed quiz: ${l.title}`)); if (score===100) rewards.push(()=>addXP(XP.perfectQuiz,'Perfect quiz bonus')); } }
  if (Q.kind==='module'){ const m=modById(Q.id), mp=(S.modules[m.id] ||= {}); const first = pass && !mp.passed; mp.best=Math.max(mp.best||0,score); if (pass) mp.passed=true; save();
    if (first){ rewards.push(()=>addXP(XP.module, `Passed Module ${m.n} assessment`)); rewards.push(()=>award('module')); rewards.push(()=>unlockNote(m)); if (MODULES.filter(modPassed).length>=3) rewards.push(()=>award('halfway')); } }
  if (Q.kind==='final'){ const first = pass && !finalPassed(); S.final = { passed: finalPassed()||pass, best: Math.max(S.final?.best||0, score) };
    if (first){ S.cert = { ref: makeCertRef(), date: Date.now() }; save(); rewards.push(()=>addXP(XP.final,'Passed the final assessment')); rewards.push(()=>award('grad')); } }
  if (score===100) rewards.push(()=>award('perfect'));
  save(); renderView(); rewards.forEach(f=>f());
}
function makeCertRef(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return `CYB-${new Date().getFullYear()}-${s}`; }
function quizResult(el, Q){
  const l = Q.kind==='lesson' ? lessonById(Q.id) : null, m = Q.kind==='module' ? modById(Q.id) : null;
  const wrong = Q.qs.map((q,i)=>({q,ok:Q.ans[i]})).filter(x=>!x.ok);
  let nextBtn = '';

function demoComplete(n){
  let gained = 0;
  MODULES.slice(0,n).forEach(m=>{ m.lessons.forEach(l=>{ const p=prog(l.id); if(!p.read){p.read=true; gained+=XP.lesson;} if(!p.activity){p.activity=true; p.actScore=100; gained+=XP.activity;} if(!p.quiz){p.quiz=true; p.quizBest=100; gained+=XP.quiz;} p.maxStage=6; });
    const mp=(S.modules[m.id] ||= {}); if(!mp.passed){ mp.passed=true; mp.best=100; gained+=XP.module; } });
  ['firstbyte','module'].forEach(id=>{ if(!S.badges.includes(id)) S.badges.push(id); }); if (n>=3 && !S.badges.includes('halfway')) S.badges.push('halfway');
  S.xp += gained; S.coins = (S.coins || 0) + Math.round(gained/5); log(`Presenter shortcut: completed ${n===1?'Module 1':'Modules 1–'+n}`, gained); save();
  UI.menu=false; renderMenu(); updateHUD(); toast(`Shortcut applied: +${gained} XP`); renderView();
}

  look: a => { const [k,v]=a.split('|'); UI.draftLook = {...UI.draftLook, [k]:v}; rerenderCreator(); },
  randomLook: () => { UI.draftLook = randomLook(); rerenderCreator(); },
  saveAvatar: () => { const name = (UI.draftName||'').trim().slice(0,18) || 'Learner';
    if (UI.editAvatar){ S.user.name=name; S.user.look=UI.draftLook; save(); UI.editAvatar=false; spriteCache.clear(); renderApp(); toast('Profile updated'); return; }
    UI.draftName = name; ACTIONS.enterCampus(); },
  cancelAvatar: () => { UI.editAvatar=false; renderApp(); },
  editAvatar: () => { UI.menu=false; UI.editAvatar=true; UI.draftLook={...S.user.look}; UI.draftName=S.user.name; clearTimers(); Campus.stop(); renderMenu(); $('#view').innerHTML = avatarCreatorHTML(); bindAvatarCreator(); },
  enterCampus: () => { S.user = { name:UI.draftName, look:UI.draftLook, joined:Date.now() }; S.view='dashboard'; save(); renderApp();
    if (Tour.shouldRun()) Tour.start(); else setTimeout(()=>award('hello'), 600); }, // first visit: BYTE's campus tour, which awards the welcome badge at the end
  openModule: a => go('module',{id:a}),
  openLesson: a => { const [id,st]=a.split('|'); const l=lessonById(id); if (!lessonUnlocked(l)){ toast('Finish the previous lesson first.'); return; } UI.lessonId=id; const p=prog(id); let s=+st; if (s===5 && !p.read) s=0; if (s===6 && !(p.read&&p.activity)) s = p.read?5:0; UI.stage=s; go('lesson'); },
  stage: a => { UI.stage=+a; renderView(); window.scrollTo({top:0}); },
  scen: a => { UI.scen[UI.lessonId]=+a; renderView(); },
  completeLesson: a => { const p=prog(a), l=lessonById(a); if (!p.read){ p.read=true; save(); addXP(XP.lesson, `Completed lesson: ${l.title}`); award('firstbyte'); } UI.stage=5; renderView(); window.scrollTo({top:0}); },
  startLessonQuiz: a => { const p=prog(a); if (!(p.read&&p.activity)){ toast('Complete the lesson and activity first.'); return; } startQuiz('lesson', a); },
  startModule: a => { const m=modById(a); if (!modLessonsDone(m)){ toast('Pass every lesson quiz in this module first.'); return; } startQuiz('module', a); },
  startFinal: () => { if (!allModsPassed()){ toast('Pass all six module assessments first.'); return; } startQuiz('final'); },
  answer: a => { const Q=UI.quiz; if (Q.picked!=null) return; Q.picked=+a; Q.ans[Q.idx] = (+a===Q.qs[Q.idx].a); renderView(); },

/* ============================================================
   INTERACTIVE ACTIVITY ENGINES — sort, select, match, toggle, password, order
   ============================================================ */
const Activities = (() => {
  let L, host, st, O = {};  // O: standalone options {onDone(score), nextAct, nextArg, nextLabel} for games played outside a lesson
  const head = a => `<div class="act-head"><span class="pill ${O.tag?'red':'purple'}">${esc(O.tag||'Practice activity')}</span><span class="label" style="color:#4a5180">Not graded · instant feedback</span></div><h2 style="margin:6px 0 6px">${esc(a.title)}</h2><p class="lesson-body" style="margin-bottom:6px">${esc(a.intro)}</p>`;

  function complete(score, badge){
    if (O.onDone){ if (badge) award(badge); O.onDone(score); return; }
    const p = prog(L.id), first = !p.activity;
    p.activity = true; p.actScore = Math.max(p.actScore||0, score); save();
    if (first){ addXP(XP.activity, `Activity complete: ${L.activity.title}`); if (score===100) addXP(XP.perfectActivity, 'Perfect activity bonus'); }
    if (badge) award(badge);
    const sb = document.querySelectorAll('.stepper button');
    if (sb[5]) sb[5].classList.add('done');
    if (sb[6]){ sb[6].disabled = false; sb[6].innerHTML = `<span class="dot">7</span>Lesson quiz`; }
    const nb = document.querySelector('.lesson-nav button[data-arg="6"]'); if (nb) nb.disabled = false;
  }
  const resultBox = (score, msg, retry) => `<div class="act-result"><div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap"><div class="score-ring" style="width:84px;height:84px;font-size:16px;margin:0;background:${score>=70?'#c9f7de':'#fff1b8'}">${score}%</div>
    <div style="flex:1; min-width:200px"><b style="font-size:17px">${score===100?'Perfect run!':score>=70?'Activity complete':'Activity complete. Worth another try?'}</b><p style="margin-top:4px; color:var(--ink-2)">${msg}</p></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap">${retry?`<button class="btn ghost small" data-act="actRetry">Try again</button>`:''}${O.onDone ? `<button class="btn small" data-act="${O.nextAct}" data-arg="${O.nextArg||''}">${esc(O.nextLabel)} ▸</button>` : `<button class="btn small" data-act="stage" data-arg="6">Continue to quiz ▸</button>`}</div></div></div>`;

  /* ---- SORT ---- */
  function sort(){
    const a = L.activity, it = a.items[st.i];
    if (st.i >= a.items.length){
      const sc = Math.round(st.res.filter(Boolean).length/a.items.length*100);
      host.innerHTML = head(a) + `<div class="progress-dots">${st.res.map(r=>`<i class="${r?'ok':'bad'}"></i>`).join('')}</div>` + resultBox(sc, `You sorted ${st.res.filter(Boolean).length} of ${a.items.length} cards correctly.`, sc<100);
      if (!st.done){ st.done=true; complete(sc); } return;
    }
    const ans = st.ans;
    host.innerHTML = head(a) + `<div class="progress-dots">${a.items.map((_,i)=>`<i class="${i<st.i?(st.res[i]?'ok':'bad'):i===st.i?'cur':''}"></i>`).join('')}</div>
      <div class="sort-card">${esc(it.t)}</div>
      <div class="buckets">${a.buckets.map(b=>`<button class="bucket ${b.c}" data-act="actSort" data-arg="${b.id}" ${ans?'disabled':''} style="${ans? (b.id===it.a?'outline:4px solid #0b7a43':'opacity:'+(b.id===ans?1:.5)) : ''}">${esc(b.t)}<small>${esc(b.d)}</small></button>`).join('')}</div>
      ${ans?`<div class="feedback ${ans===it.a?'ok':'bad'}"><b>${ans===it.a?'Correct!':'Not quite.'}</b> ${esc(it.fb)}</div><div class="lesson-nav" style="margin-top:12px"><span></span><button class="btn" data-act="actNext">${st.i<a.items.length-1?'Next card ▸':'Finish ▸'}</button></div>`:''}`;
  }

  /* ---- SELECT (email / logs) ---- */
  function select(){
    const a = L.activity;
    if (a.variant==='email'){
      const span = (s, k) => { if (s.x===1) return esc(s.t).replace(/\n/g,'<br>'); const id = s.id || ('n'+k); let cls='hot';
        if (st.checked){ const isT = !!s.id && a.targets.includes(s.id); if (st.flags[id] && isT) cls+=' okflag'; else if (st.flags[id]) cls+=' flag'; else if (isT) cls+=' miss'; }
        else if (st.flags[id]) cls+=' flag';
        return `<span class="${cls}" data-act="actFlag" data-arg="${id}" role="button" tabindex="0">${esc(s.t)}</span>`; };
      let k=0; const E = a.email;
      host.innerHTML = head(a) + `<div class="email-mock sel-email"><div class="eh"><div>${E.from.map(s=>span(s,k++)).join('')}</div><div>${E.subject.map(s=>span(s,k++)).join('')}</div></div><div class="eb">${E.body.map(s=>span(s,k++)).join('')}</div></div>
        <p class="note" style="color:var(--ink-2); margin-top:8px">Flagged: ${Object.values(st.flags).filter(Boolean).length}</p>` + (st.checked ? selectFeedback() : `<div class="lesson-nav" style="margin-top:12px"><span></span><button class="btn" data-act="actCheck">Check my answers</button></div>`);
    } else {
      host.innerHTML = head(a) + `<div class="log-lines">${a.lines.map(ln=>{ let cls='log-line'; if (st.checked){ if (st.flags[ln.id]&&ln.bad) cls+=' okflag'; else if (st.flags[ln.id]) cls+=' flag'; else if (ln.bad) cls+=' miss'; } else if (st.flags[ln.id]) cls+=' flag';
        return `<button class="${cls}" data-act="actFlag" data-arg="${ln.id}" ${st.checked?'disabled':''}><span>${ln.time}</span><span>${esc(ln.t)}</span></button>`; }).join('')}</div>` + (st.checked ? selectFeedback() : `<div class="lesson-nav" style="margin-top:12px"><span class="note" style="color:var(--ink-2)">Flagged: ${Object.values(st.flags).filter(Boolean).length}</span><button class="btn" data-act="actCheck">Check my answers</button></div>`);
    }
  }
  function selectEval(){
    const a = L.activity; let targets, info;
    if (a.variant==='email'){ const all=[...a.email.from,...a.email.subject,...a.email.body]; info={}; all.forEach((s,k)=>{ if (s.x!==1) info[s.id||('n'+k)] = s; }); targets=a.targets; }
    else { info={}; a.lines.forEach(l=>info[l.id]=l); targets=a.lines.filter(l=>l.bad).map(l=>l.id); }
    const found = targets.filter(t=>st.flags[t]), missed = targets.filter(t=>!st.flags[t]);
    const fp = Object.keys(st.flags).filter(id=>st.flags[id] && !targets.includes(id));
    return {targets, found, missed, fp, info};
  }
  function selectFeedback(){
    const a = L.activity, R = selectEval();
    const sc = Math.max(0, Math.round((R.found.length - R.fp.length)/R.targets.length*100));
    const items = [...R.found.map(id=>`<li>✓ <b>Found:</b> ${esc(R.info[id].fb)}</li>`), ...R.missed.map(id=>`<li>✗ <b>Missed:</b> ${esc(R.info[id].fb)}</li>`), ...R.fp.map(id=>`<li>• <b>Looks normal:</b> ${esc(R.info[id].fb)}</li>`)];
    return `<div class="act-result" style="margin-top:14px"><ul style="margin:0; padding-left:4px; list-style:none; display:grid; gap:6px; font-size:14px">${items.join('')}</ul></div>` + resultBox(sc, `You found ${R.found.length} of ${R.targets.length} warning signs${R.fp.length?` and flagged ${R.fp.length} normal item${R.fp.length>1?'s':''}`:''}.`, sc<100);
  }

  /* ---- MATCH ---- */
  function match(){
    const a = L.activity, letters='ABCDE';
    const rightIdx = id => st.order.indexOf(id);
    host.innerHTML = head(a) + `<div class="match-cols">
      <div class="col"><div class="label" style="color:#4a5180">Situation</div>${a.left.map(it=>{ const pr = st.pairs[it.id]; let cls='mitem'; if (st.sel===it.id) cls+=' sel'; if (st.checked) cls += pr===it.id?' right':' wrong';
        return `<button class="${cls}" data-act="actLeft" data-arg="${it.id}" ${st.checked?'disabled':''}><span class="tag">${pr?letters[rightIdx(pr)]:'?'}</span>${esc(it.t)}</button>`; }).join('')}</div>
      <div class="col"><div class="label" style="color:#4a5180">Answer</div>${st.order.map((id,i)=>{ const r=a.right.find(x=>x.id===id), used=Object.values(st.pairs).includes(id);
        return `<button class="mitem" data-act="actRight" data-arg="${id}" ${st.checked?'disabled':''} style="${used?'background:var(--paper-2)':''}"><span class="tag" style="background:${used?'#5b45c9':'var(--paper-2)'}; color:${used?'#fff':'inherit'}">${letters[i]}</span>${esc(r.t)}</button>`; }).join('')}</div></div>
      ${st.checked ? (()=>{ const ok=a.left.filter(it=>st.pairs[it.id]===it.id).length, sc=Math.round(ok/a.left.length*100);
          return `<div class="act-result" style="margin-top:14px; font-size:14px">${a.left.filter(it=>st.pairs[it.id]!==it.id).map(it=>`<div>✗ "${esc(it.t)}" → <b>${esc(a.right.find(r=>r.id===it.id).t)}</b></div>`).join('') || 'Every pair is correct.'}</div>` + resultBox(sc, `${ok} of ${a.left.length} pairs matched correctly.`, sc<100); })()
        : `<div class="lesson-nav" style="margin-top:12px"><span class="note" style="color:var(--ink-2)">${st.sel?'Now choose an answer on the right.':'Choose a situation on the left.'}</span><button class="btn" data-act="actCheck" ${Object.keys(st.pairs).length===a.left.length?'':'disabled'}>Check matches</button></div>`}`;
  }

  /* ---- TOGGLE (router) ---- */
  function toggle(){
    const a = L.activity, good = a.settings.filter(s=>st.ch[s.id]===s.good).length;
    host.innerHTML = head(a) + `<div class="router"><div class="rhead"><span>⌂ HomeRouter AX-200 · Admin panel</span>${st.checked?`<span class="pill ${good===a.settings.length?'green':'gold'}">Security level ${good}/${a.settings.length}</span>`:'<span class="pill">Unsaved changes</span>'}</div>
      ${a.settings.map(s=>{ const c=st.ch[s.id]; return `<div class="setting ${st.checked?(c===s.good?'good':'badset'):''}"><div><b style="font-weight:600">${esc(s.t)}</b><small>${esc(s.d)}</small>${st.checked?`<small style="color:${c===s.good?'var(--green)':'#ffb0b8'}; margin-top:4px">${c===s.good?'✓':'✗'} ${esc(s.fb[c])}</small>`:''}</div>
        <div class="seg">${s.opts.map((o,i)=>`<button class="${c===i?'on':''}" data-act="actSet" data-arg="${s.id}|${i}">${esc(o)}</button>`).join('')}</div></div>`; }).join('')}</div>
      ${st.checked ? resultBox(Math.round(good/a.settings.length*100), good===a.settings.length ? 'Your network is locked down.' : 'Change the red settings and press Check again to improve your score.', false) + `<div class="lesson-nav" style="margin-top:10px"><span></span><button class="btn ghost small" data-act="actCheck">Check again</button></div>`
        : `<div class="lesson-nav" style="margin-top:12px"><span></span><button class="btn" data-act="actCheck">Save & check</button></div>`}`;
  }

  /* ---- PASSWORD ---- */
  const COMMON = ['password','123456','12345678','qwerty','abc123','iloveyou','admin','welcome','letmein','monkey','dragon','111111','sunshine','p@ssw0rd','password1','malaysia'];
  function pwScore(pw){
    const name = (S.user?.name||'').toLowerCase().replace(/\s+/g,'');
    const low = pw.toLowerCase();
    const checks = {
      len12: pw.length>=12, len16: pw.length>=16,
      mix: [/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(pw)).length>=3,
      words: pw.split(/[\s\-_.]+/).filter(w=>w.length>=3).length>=3,
      notCommon: pw.length>0 && !COMMON.some(c=>low.includes(c)),
      noName: pw.length>0 && !(name.length>=3 && low.includes(name)),
      noSeq: pw.length>0 && !/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf|(.)\2\2)/i.test(pw)
    };
    let s = 0; if (pw.length>=8) s++; if (checks.len12) s++; if (checks.len16) s++; if (checks.mix) s++; if (checks.words) s++;
    if (!checks.notCommon) s = Math.min(s,1); if (!checks.noName) s = Math.max(0,s-2); if (!checks.noSeq) s = Math.max(0,s-1);
    let pool = 0; if (/[a-z]/.test(pw)) pool+=26; if (/[A-Z]/.test(pw)) pool+=26; if (/\d/.test(pw)) pool+=10; if (/[^A-Za-z0-9]/.test(pw)) pool+=32;
    let secs = Math.pow(Math.max(pool,1), pw.length) / 1e10; if (s<=1) secs = Math.min(secs, 1);
    const time = secs<1?'instantly':secs<3600?'minutes':secs<86400*30?'days':secs<3.15e7*100?'years':secs<3.15e7*1e6?'centuries':'millions of years';
    return { s: Math.min(5,s), checks, time };
  }
  function password(){
    const a = L.activity;
    host.innerHTML = head(a) + `<label class="label" for="pwIn" style="color:#4a5180">Your test password</label><input id="pwIn" class="pw-input" type="text" autocomplete="off" spellcheck="false" placeholder="try: rambutan-rocket-umbrella-42" value="${esc(st.pw||'')}">
      <div class="meter" id="pwMeter">${[0,1,2,3,4].map(()=>'<i></i>').join('')}</div>
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:8px"><b id="pwLabel">Start typing…</b><span style="color:var(--ink-2)">Estimated crack time: <b id="pwTime">–</b></span></div>
      <ul class="checks" id="pwChecks"></ul>
      <div class="lesson-nav" style="margin-top:14px"><span class="note" style="color:var(--ink-2)">Reach "Strong" to complete the challenge.</span><button class="btn green" id="pwLock" data-act="actPwLock" disabled>Lock it in</button></div><div id="pwRes"></div>`;
    const inp = $('#pwIn'); const upd = ()=>{ st.pw = inp.value; const r = pwScore(inp.value);
      const labels = ['Very weak','Weak','Fair','Good','Strong','Excellent'], colors=['#ff5d6e','#ff5d6e','#ff9a3d','#ffd447','#2fc77a','#2fc77a'];
      document.querySelectorAll('#pwMeter i').forEach((el,i)=> el.style.background = i < r.s ? colors[r.s] : '');
      $('#pwLabel').textContent = inp.value ? labels[r.s] : 'Start typing…'; $('#pwLabel').style.color = inp.value? (r.s>=4?'#0b7a43':r.s>=2?'#9a6a00':'#b3203a') : '';
      $('#pwTime').textContent = inp.value ? r.time : '–';
      const c = r.checks; $('#pwChecks').innerHTML = [['At least 12 characters',c.len12],['16+ characters (bonus)',c.len16],['Mix of letters, numbers or symbols',c.mix],['3+ separate words (passphrase)',c.words],['Not a common password',c.notCommon],['Doesn\'t contain your name',c.noName],['No simple sequences (1234, aaa)',c.noSeq]].map(([t,ok])=>`<li class="${ok?'ok':''}">${t}</li>`).join('');
      $('#pwLock').disabled = r.s < 4; st.score = r.s; };
    inp.addEventListener('input', upd); upd(); if (!st.pw) inp.focus({preventScroll:true});
  }

  /* ---- ORDER ---- */
  function order(){
    const a = L.activity, placed = st.placed, pool = st.pool.filter(id=>!placed.includes(id));
    const stepT = id => a.steps.find(s=>s.id===id).t;
    host.innerHTML = head(a) + `<div class="order-slots">${a.steps.map((_,i)=>{ const id=placed[i]; let cls='slot'; if (id) cls+=' filled'; if (st.checked) cls += (id===a.steps[i].id)?' right':' wrong';
        return `<div class="${cls}" ${id&&!st.checked?`data-act="actUnplace" data-arg="${i}" role="button" tabindex="0" style="cursor:pointer"`:''}>${id?esc(stepT(id)):'<span style="color:var(--ink-2)">Click a step below…</span>'}</div>`; }).join('')}</div>
      <div class="pool">${pool.map(id=>`<button class="mitem" data-act="actPlace" data-arg="${id}">${esc(stepT(id))}</button>`).join('')}</div>
      ${st.checked ? (()=>{ const ok = a.steps.filter((s,i)=>placed[i]===s.id).length, sc=Math.round(ok/a.steps.length*100); return resultBox(sc, ok===a.steps.length?'Textbook incident response.':`${ok} of ${a.steps.length} steps in the right place. Correct order: Prepare → Identify → Contain → Eradicate → Recover → Lessons learned.`, sc<100); })()
        : `<div class="lesson-nav" style="margin-top:12px"><button class="btn ghost small" data-act="actOrderReset">Clear</button><button class="btn" data-act="actCheck" ${placed.length===a.steps.length?'':'disabled'}>Check order</button></div>`}`;
  }

  const ENGINES = { sort, select, match, toggle, password, order };
  function init(){
    const a = L.activity;
    st = { i:0, res:[], ans:null, flags:{}, checked:false, done:false, pairs:{}, sel:null, order:shuffle(a.right?a.right.map(r=>r.id):[]), ch:{}, pw:'', placed:[], pool:shuffle(a.steps?a.steps.map(s=>s.id):[]) };
    if (a.type==='toggle') a.settings.forEach(s=> st.ch[s.id] = s.good===0 ? 1 : 0);
  }
  function draw(){ ENGINES[L.activity.type](); }
  function mount(lesson, el, opts={}){ L = lesson; host = el; O = opts; init(); draw(); }

  window.EXTRA_ACTIONS = Object.assign(window.EXTRA_ACTIONS||{}, {
    actSort: b => { st.ans = b; st.res[st.i] = (b === L.activity.items[st.i].a); draw(); },
    actNext: () => { st.i++; st.ans = null; draw(); },
    actRetry: () => { init(); draw(); },
    actFlag: id => { if (st.checked) return; st.flags[id] = !st.flags[id]; draw(); },
    actLeft: id => { st.sel = id; draw(); },
    actRight: id => { if (!st.sel) { toast('Pick a situation on the left first.'); return; } Object.keys(st.pairs).forEach(k=>{ if (st.pairs[k]===id) delete st.pairs[k]; }); st.pairs[st.sel] = id;
      const next = L.activity.left.find(it=>!st.pairs[it.id]); st.sel = next ? next.id : null; draw(); },
    actSet: a => { const [id,i] = a.split('|'); st.ch[id] = +i; if (st.checked) st.checked = false; draw(); },
    actPlace: id => { st.placed.push(id); draw(); },
    actUnplace: i => { st.placed.splice(+i,1); draw(); },
    actOrderReset: () => { st.placed = []; draw(); },
    actPwLock: () => { const r = pwScore(st.pw); if (r.s<4) return; $('#pwRes').innerHTML = resultBox(r.s===5?100:85, r.s===5?'Excellent: long, unique and hard to guess.':'Strong. Add more words or length to reach Excellent.', false); complete(r.s===5?100:85, r.s===5?'pass':null); },
    actCheck: () => {
      const a = L.activity; st.checked = true; draw();

/* ---------- Title screen scene (sign-in pages) ----------

function startTitleScene(cv){
  const g = cv.getContext('2d'); let s = 2, LW = 0, LH = 0, front = null, frontKey = '', last = performance.now(), pan = 0;
  const ROW = ['library','ailab','community','home','challenge','achieve','cert'];
  const clouds = Array.from({length:9}, (_,i)=>({ x:(i*0.137+0.05)%1, y:0.05+((i*37)%10)/10*0.36, w:46+((i*23)%5)*14, far:i%3===0 }));
  const walkers = COMMUNITY_USERS.slice(0,6).map((u,i)=>({ look:u.look, x:(i*0.19+0.07)%1, dir:i%2 ? 1 : -1, sp:9+(i%3)*4, f:0 }));
  function size(){ s = Math.max(2, Math.floor(Math.min(innerHeight/300, innerWidth/170))); LW = Math.ceil(innerWidth/s); LH = Math.ceil(innerHeight/s);
    cv.width = LW*s; cv.height = LH*s; g.imageSmoothingEnabled = false; frontKey = ''; }
  function cloud(x, y, w, far){ const h = Math.round(w*0.32), day = isDay();
    const top = day ? (far ? '#e8f4ff' : '#ffffff') : (far ? '#232a66' : '#2f3a86'), under = day ? '#c9dcff' : (far ? '#1b2158' : '#252e73');

    g.fillStyle = top; g.fillRect(x, y+h*0.45|0, w, h*0.45|0); g.fillRect(x+w*0.12|0, y+h*0.2|0, w*0.5|0, h*0.4|0); g.fillRect(x+w*0.4|0, y, w*0.3|0, h*0.4|0); g.fillRect(x+w*0.62|0, y+h*0.25|0, w*0.25|0, h*0.3|0);
    g.fillStyle = under; g.fillRect(x, y+h*0.9|0, w, Math.max(2, h*0.12|0)); }

    let x = Math.round((LW-total)/2); while (x > 0) x -= total+gap; // repeat the row to fill wide screens

    f.fillStyle = P.path[0]; f.fillRect(0, base, LW, 18); f.fillStyle = P.pathLine; f.fillRect(0, base, LW, 1); f.fillRect(0, base+17, LW, 1);

    for (let lx=24; lx<LW; lx+=72){ if (!day){ const grd = f.createRadialGradient(lx, base-14, 1, lx, base-14, 22); grd.addColorStop(0,'rgba(255,212,71,0.3)'); grd.addColorStop(1,'rgba(255,212,71,0)'); f.fillStyle = grd; f.fillRect(lx-22, base-36, 44, 44); }

const KB = [
  {k:['hello','hi ','hey','salam','good morning','good evening'], a:`Hey there! 👋 I'm BYTE, your cybersecurity mentor. Ask me about any topic from your lessons, like phishing, passwords, firewalls or encryption, or say <b>"quiz me"</b> for a practice question.`},

  {k:['what is cybersecurity','what\'s cybersecurity','define cybersecurity'], a:`<p><b>Cybersecurity</b> is protecting devices, networks and data from attacks, damage and unauthorised access.</p><p>Think of it like home security for your digital life: locks (passwords), alarms (monitoring), insurance (backups) and knowing not to open the door to strangers (phishing awareness).</p>`},
  {k:['cia','triad','confidentiality','integrity','availability'], a:`<p>The <b>CIA Triad</b> is the three goals of security:</p><ul><li><b>Confidentiality</b>: only the right people can see it (encryption, passwords)</li><li><b>Integrity</b>: it stays accurate and unchanged (hashing, signatures)</li><li><b>Availability</b>: it works when you need it (backups, DDoS protection)</li></ul><p>Tip: when you hear about an attack, ask "which corner did it break?"</p>`},
  {k:['threat','vulnerability','asset','risk'], a:`<p>Easy way to remember:</p><ul><li><b>Asset</b> = what you protect (your phone)</li><li><b>Threat</b> = what could harm it (a thief)</li><li><b>Vulnerability</b> = the weakness (no screen lock)</li><li><b>Risk</b> = chance it happens × how bad it would be</li></ul>`},
  {k:['phish','scam','suspicious email','fake email','suspicious link'], a:`<p><b>Phishing</b> is a message pretending to be someone you trust so you'll click, download or share secrets. Red flags:</p><ul><li>Sender address that's <i>almost</i> right</li><li>Urgency: "act within 24 hours!"</li><li>Links whose real destination doesn't match</li><li>Requests for passwords or OTP/TAC codes</li></ul><p>Golden rule: don't use the link. Go to the official app or website yourself.</p>`},
  {k:['smish','sms','vish','phone call','scam call'], a:`<p><b>Smishing</b> = phishing by SMS, <b>vishing</b> = phishing by voice call. Scammers may pretend to be a courier, bank, police or a government agency.</p><p>Hang up or ignore, then call the organisation using a number from its official website. Real organisations won't pressure you to transfer money or share codes on the spot.</p>`},
  {k:['social engineering','manipulat'], a:`<p><b>Social engineering</b> means hacking people instead of computers, using trust, fear, curiosity or urgency.</p><p>Examples: a caller pretending to be IT support, a USB stick labelled "Salaries" left in the car park, or someone tailgating through a secure door. Pause and verify before you act.</p>`},
  {k:['malware','virus','worm','trojan','spyware','keylogger'], a:`<ul><li><b>Virus</b>: hides in files and spreads when they're shared</li><li><b>Worm</b>: spreads by itself across networks</li><li><b>Trojan</b>: disguised as something useful</li><li><b>Spyware</b>: secretly watches you and steals data</li></ul><p>Best defences: keep software updated, install apps only from official stores, and don't open unexpected attachments.</p>`},
  {k:['ransomware','ransom','encrypted my files'], a:`<p><b>Ransomware</b> locks your files and demands payment.</p><p>If it happens: <b>disconnect from the network</b>, report it immediately and don't pay (it funds criminals and doesn't guarantee recovery). The best protection is <b>offline backups</b> using the 3-2-1 rule.</p>`},
  {k:['password manager'], a:`<p>A <b>password manager</b> is a secure vault that creates and remembers a strong, unique password for every account. You only remember one strong master password.</p><p>Turn on MFA for the manager itself, and you're in great shape.</p>`},
  {k:['password','passphrase','strong password'], a:`<p>Strong password recipe:</p><ul><li><b>Long</b>: 12–16+ characters (length beats complexity)</li><li><b>Unique</b>: never reuse across accounts</li><li><b>Unguessable</b>: no names, birthdays or IC numbers</li></ul><p>Try a passphrase of random words like <code>mango-rocket-quiet-lantern</code>, and let a password manager remember the rest.</p>`},
  {k:['mfa','2fa','two factor','two-factor','multi-factor','otp','authenticator'], a:`<p><b>Multi-factor authentication</b> combines different types of proof:</p><ul><li>Something you <b>know</b> (password)</li><li>Something you <b>have</b> (phone, security key)</li><li>Something you <b>are</b> (fingerprint, face)</li></ul><p>Even if your password leaks, the attacker still needs your second factor. Authenticator apps are safer than SMS codes. And <b>never</b> share an OTP with anyone.</p>`},

  {k:['vpn'], a:`<p>A <b>VPN</b> creates an encrypted tunnel between your device and the VPN server, so people on the same public Wi-Fi can't snoop on your traffic.</p><p>It doesn't make you invisible or protect you from phishing, so you still need good habits.</p>`},

  {k:['wifi','wi-fi','public network','hotspot','router','wpa'], a:`<p>Wi-Fi safety checklist:</p><ul><li>Home router: change the default admin password, use <b>WPA3</b> (or WPA2), keep firmware updated, turn off WPS</li><li>Public Wi-Fi: avoid banking; use mobile data or a trusted VPN</li><li>Watch for "evil twin" hotspots with look-alike names</li></ul>`},
  {k:['ip address','dns','network','protocol'], a:`<p>Quick network basics:</p><ul><li><b>IP address</b>: a device's address on a network</li><li><b>Router</b>: directs traffic between your network and the internet</li><li><b>DNS</b>: turns names like cybersity.app into IP addresses</li><li><b>Protocol</b>: the rules devices use to talk (HTTP, DNS, SMTP)</li></ul>`},
  {k:['hash'], a:`<p><b>Hashing</b> turns data into a fixed-length fingerprint. It's <b>one-way</b>: you can't turn the hash back into the original.</p><p>Websites store password hashes instead of real passwords, and even a one-letter change produces a completely different hash. Try it in the Lesson 5.1 hash playground!</p>`},
  {k:['encrypt','decrypt','cipher'], a:`<p><b>Encryption</b> scrambles data with a key so only someone with the right key can read it. Unlike hashing, it's <b>reversible</b>.</p><p>You use it every day: HTTPS websites, WhatsApp messages and phone storage are all encrypted.</p>`},
  {k:['backup','3-2-1','321'], a:`<p>The <b>3-2-1 backup rule</b>: keep <b>3</b> copies of important data, on <b>2</b> different types of storage, with <b>1</b> copy offsite or offline.</p><p>It protects you from ransomware, theft, broken drives and accidents.</p>`},
  {k:['log','monitor','soc','siem'], a:`<p><b>Logs</b> are records of events like logins and file access. A <b>SOC</b> (Security Operations Centre) watches them for warning signs:</p><ul><li>Bursts of failed logins</li><li>Logins from unusual places or times</li><li>Surprise new admin accounts</li><li>Huge data transfers at night</li></ul>`},
  {k:['incident','breach','hacked','got hacked','compromised','clicked a link','clicked the link'], a:`<p>If you think something went wrong:</p><ul><li><b>Report it</b> to IT/security straight away (speed matters!)</li><li>Change the affected password, and anywhere else you reused it</li><li>Disconnect an infected device from the network</li><li>Don't delete evidence</li></ul><p>Pros follow: Prepare → Identify → Contain → Eradicate → Recover → Lessons learned.</p>`},

    study:['Quiz tip: read the explanations even when you get it right','Module 5 hashing playground is so cool','Who\'s up for a Module 6 run tomorrow?'],
    wins:['Level 4 Packet Ranger unlocked!','Got Perfect Score on the CIA quiz 💯','Passed Module 2 assessment 🎉']
  };
  const REPLIES = [
    [/^(hi|hello|hey|salam|morning|evening)/i, n=>[`Hey ${n}! Welcome 👋`,`Hi ${n}! Which module are you on?`]],
    [/phish|scam|sms|link/i, ()=>['Rule of thumb: never click, go to the official site yourself','Ugh scammers are everywhere. Good on you for spotting it!']],

    [/thank|tq|thanks/i, ()=>['Anytime 🙌','No problem!']],

  ];
  let typingWho = null;
  const MOD = [
    {re:/[\w.+-]+@[\w-]+\.[\w.]+/, why:'an email address'},
    {re:/(\+?6?01\d[-\s]?\d{3,4}[-\s]?\d{4})|(\b\d{9,12}\b)/, why:'a phone number'},
    {re:/\b\d{6}-\d{2}-\d{4}\b/, why:'an IC number'},
    {re:/(my )?password (is|=|:)/i, why:'a password'},
    {re:/\b(stupid|idiot|dumb|bodoh)\b/i, why:'disrespectful language'}

  function look(n){ return n===S.user?.name ? S.user.look : (U(n)?.look || COMMUNITY_USERS[0].look); }

      ${!me && !m.removed?`<button class="rep" data-act="reportMsg" data-arg="${m.id}">${m.reported?'Reported':'Report'}</button>`:''}</div>`;
  }

  function post(room, user, text, extra={}){ const m = {id:mid++, user, text, t:Date.now(), ...extra}; MSG[room].push(m); if (UI.room===room) paint(); return m; }
  function botReply(text){

  }
  function send(text){

  function removeMessage(id){ Object.values(MSG).forEach(list=>list.forEach(m=>{ if (m.id===id) m.removed=true; })); paint(); }
  function find(id){ for (const [room,list] of Object.entries(MSG)){ const m=list.find(x=>x.id===id); if (m) return {room,m}; } return null; }

})();

const Tour = (() => {
  let on = false, i = 0, token = 0, layer = null, typer = null, full = '', mode = 'say', raf = null, portraitT = null, sound = false, audio = null;
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const seenMap = () => { try { return JSON.parse(localStorage.getItem(TOUR_KEY)) || {}; } catch(e){ return {}; } };
  const nameKey = () => (S.user && S.user.name || '').trim().toLowerCase();
  function markSeen(status){ const m = seenMap(); m[nameKey()] = status; try { localStorage.setItem(TOUR_KEY, JSON.stringify(m)); } catch(e){} }
  const shouldRun = () => !!(S.user && !seenMap()[nameKey()]);
  const fill = s => s.replace(/\{name\}/g, S.user ? S.user.name : 'friend');
  const $t = sel => layer.querySelector(sel);

  // 8-bit "blip" while BYTE talks (off by default, remembered per device)
  try { sound = localStorage.getItem(TOUR_SOUND_KEY) === 'on'; } catch(e){}
  function blip(){ if (!sound) return; try { audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(); o.type = 'square'; o.frequency.value = 480 + Math.random()*120;
    g.gain.setValueAtTime(0.035, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.05);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.05); } catch(e){} }

  function build(){
    layer = document.createElement('div'); layer.className = 'tour'; layer.id = 'tour';
    layer.innerHTML = `<div class="tour-dim"></div><div class="tour-spot hidden"></div><div class="tour-arrow hidden" aria-hidden="true">▼</div>
      <section class="tour-box" role="dialog" aria-modal="true" aria-label="Campus tour with BYTE">
        <div class="tour-tools"><span class="tour-count"></span>
          <button class="tour-tool" data-tour="sound" aria-pressed="${sound}" title="Sound effects">${sound ? '♪ On' : '♪ Off'}</button>
          <button class="tour-tool" data-tour="skip">Skip tour ✕</button></div>
        <div class="tour-portrait"><canvas width="14" height="16" class="px" aria-hidden="true"></canvas></div>
        <div class="tour-main"><div class="tour-name">BYTE <span>Campus guide</span></div>
          <p class="tour-text" aria-hidden="true"></p><p class="sr-only" aria-live="polite"></p>
          <div class="tour-choices"></div><div class="tour-next hidden" aria-hidden="true">▼</div></div>
      </section>`;
    document.body.appendChild(layer);
    layer.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey, true);
    // portrait: BYTE blinks, waves and moves its mouth while talking
    let f = 0; portraitT = setInterval(()=>{ f++; const st = TOUR_STEPS[i] || {}, c = $t('.tour-portrait canvas'); if (!c) return;
      const talking = !!typer, expr = (f%23===0) ? 'blink' : (talking && f%2 ? 'normal' : (st.face||'happy'));
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0,0,14,16); x.drawImage(botFace(expr, f, mode==='say' && !!st.wave), 0, 0); }, 140);
    raf = requestAnimationFrame(trackSpot);
  }

  // Spotlight follows its target every frame (buildings move with the campus camera)
  function targetRect(){
    const st = TOUR_STEPS[i]; if (!st || mode==='walk' || !st.spot) return null;
    if (st.spot==='player' || Campus.buildings.some(b=>b.id===st.spot)) return Campus.tour.rectOf(st.spot);
    const el = document.querySelector(st.spot); return el ? el.getBoundingClientRect() : null;
  }
  let cur = null; // spotlight box, eased towards its target each frame so it glides between stops and keeps up with the camera
  function trackSpot(){
    if (!on) return; const r = targetRect(), spot = $t('.tour-spot'), arrow = $t('.tour-arrow'), box = $t('.tour-box');
    if (r && r.width){ const pad = 6, k = reduced() ? 1 : 0.3;
      if (!cur || spot.classList.contains('hidden')) cur = { l:r.left, t:r.top, w:r.width, h:r.height };
      else { cur.l += (r.left-cur.l)*k; cur.t += (r.top-cur.t)*k; cur.w += (r.width-cur.w)*k; cur.h += (r.height-cur.h)*k; }
      spot.classList.remove('hidden'); arrow.classList.remove('hidden'); layer.classList.add('has-spot');
      Object.assign(spot.style, { left:(cur.l-pad)+'px', top:(cur.t-pad)+'px', width:(cur.w+pad*2)+'px', height:(cur.h+pad*2)+'px' });
      const below = r.top < 90; arrow.classList.toggle('up', below);
      Object.assign(arrow.style, { left:(r.left+r.width/2)+'px', top:(below ? r.top+r.height+pad+4 : r.top-pad-30)+'px' });
      box.classList.toggle('top', r.top + r.height/2 > innerHeight*0.55);
    } else { spot.classList.add('hidden'); arrow.classList.add('hidden'); layer.classList.remove('has-spot'); box.classList.remove('top'); }
    raf = requestAnimationFrame(trackSpot);
  }
  // Scroll the page so a building being explained isn't hidden behind the dialogue box
  function ensureVisible(){
    const r = targetRect(); if (!r) return; const st = TOUR_STEPS[i]; if (typeof st.spot==='string' && st.spot[0] !== '#' && st.spot[0] !== '.' ){
      const box = $t('.tour-box').getBoundingClientRect(), topLimit = 80, bottomLimit = innerHeight - box.height - 30;
      if (r.top < topLimit || r.top + r.height > bottomLimit) window.scrollBy({ top: r.top - (topLimit + Math.max(0, (bottomLimit - topLimit - r.height)/2)), behavior: reduced() ? 'auto' : 'smooth' }); }
  }

  function say(text, after){
    clearInterval(typer); typer = null; full = text; mode = 'say';
    const out = $t('.tour-text'); $t('.sr-only').textContent = text; $t('.tour-choices').innerHTML = ''; $t('.tour-next').classList.add('hidden');
    const done = () => { clearInterval(typer); typer = null; out.textContent = full; after(); };
    if (reduced()){ done(); return; }
    let n = 0; out.textContent = '';
    typer = setInterval(()=>{ n++; out.textContent = full.slice(0, n); if (n%2 && full[n-1] !== ' ') blip(); if (n >= full.length) done(); }, 24);
  }
  const showNext = () => $t('.tour-next').classList.remove('hidden');
  function choices(list){ $t('.tour-choices').innerHTML = list.map((c,k)=>`<button class="btn small ${k ? 'ghost' : 'gold'}" data-tour="choice" data-arg="${k}">${esc(c.t)}</button>`).join('');
    const first = $t('.tour-choices button'); if (first) first.focus({preventScroll:true}); }

  async function runStep(){
    const st = TOUR_STEPS[i], my = ++token;
    $t('.tour-count').textContent = `${i+1}/${TOUR_STEPS.length}`;
    if (st.walk){ mode = 'walk'; Campus.tour.focus(st.walk); Campus.tour.set({ expr:'normal', wave:false });
      clearInterval(typer); typer = null; $t('.tour-text').textContent = '…'; $t('.tour-choices').innerHTML = ''; $t('.tour-next').classList.add('hidden');
      await Campus.tour.walk(st.walk); if (!on || my !== token) return; }
    if (!st.walk || st.walk === 'player') Campus.tour.focus(st.spot === 'player' ? null : st.spot);
    Campus.tour.set({ expr: st.face, wave: !!st.wave });
    mode = 'say'; setTimeout(ensureVisible, 60);
    say(fill(st.say), () => {
      if (st.end){ mode = 'end'; choices(st.end); }
      else if (st.more){ mode = 'more'; choices([{t:'Tell me more'}, {t:'Got it!'}]); }
      else showNext();
    });
  }
  function next(){ i++; if (i >= TOUR_STEPS.length) finish('done'); else runStep(); }
  function advance(){
    if (mode === 'walk'){ Campus.tour.arrive(); return; }
    if (typer){ clearInterval(typer); typer = null; $t('.tour-text').textContent = full; const st = TOUR_STEPS[i];
      if (mode === 'say' && full === fill(st.say)){ if (st.end){ mode='end'; choices(st.end); } else if (st.more){ mode='more'; choices([{t:'Tell me more'}, {t:'Got it!'}]); } else showNext(); }
      else showNext(); return; }
    if (mode === 'say' || mode === 'extra') next();
  }
  function pick(k){
    const st = TOUR_STEPS[i];
    if (mode === 'confirm'){ if (k === 1) finish('skipped'); else { mode = 'say'; $t('.tour-text').textContent = full; resumeAfterConfirm(); } return; }
    if (mode === 'more'){ if (k === 0){ mode = 'extra'; say(st.more, showNext); mode = 'extra'; } else next(); return; }
    if (mode === 'end') finish('done', st.end[k].go);
  }
  let resumeAfterConfirm = () => {};
  function askSkip(){
    if (mode === 'confirm') return; const prev = { mode, text: $t('.tour-text').textContent, choicesHTML: $t('.tour-choices').innerHTML, next: !$t('.tour-next').classList.contains('hidden') };
    clearInterval(typer); typer = null; Campus.tour.set({ expr:'think', wave:false }); mode = 'confirm';
    $t('.tour-text').textContent = 'Skip the tour? You can replay it any time from the ⚙ menu.'; $t('.tour-next').classList.add('hidden');
    choices([{t:'Keep going'}, {t:'Skip tour'}]);
    resumeAfterConfirm = () => { const st = TOUR_STEPS[i]; Campus.tour.set({ expr: st.face, wave: !!st.wave });
      if (prev.mode === 'walk'){ token++; runStep(); return; }
      mode = prev.mode; $t('.tour-text').textContent = full; $t('.tour-choices').innerHTML = prev.choicesHTML;
      if (!prev.choicesHTML) showNext(); };
  }

  function onClick(e){
    const b = e.target.closest('[data-tour]'); if (b){ e.stopPropagation();
      const a = b.dataset.tour;
      if (a === 'skip') askSkip();
      else if (a === 'sound'){ sound = !sound; try { localStorage.setItem(TOUR_SOUND_KEY, sound ? 'on' : 'off'); } catch(err){} b.setAttribute('aria-pressed', sound); b.textContent = sound ? '♪ On' : '♪ Off'; if (sound) blip(); }
      else if (a === 'choice') pick(+b.dataset.arg);
      return; }
    if (mode !== 'more' && mode !== 'end' && mode !== 'confirm') advance();
  }
  function onKey(e){
    if (!on) return; if (e.key === 'Tab') return;
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); if (mode === 'confirm') pick(0); else askSkip(); return; }
    if (e.target.closest && e.target.closest('.tour button') && (e.key === 'Enter' || e.key === ' ')){ e.stopPropagation(); return; } // let the focused button click
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); if (mode !== 'more' && mode !== 'end' && mode !== 'confirm') advance(); return; }
    e.stopPropagation(); if (e.key.startsWith('Arrow')) e.preventDefault(); // keep the campus still while BYTE talks
  }

  function start(){
    if (on || !S.user) return;
    UI.menu = false; renderMenu(); if (UI.drawer) Mentor.toggleDrawer(); if (UI.campusFS) EXTRA_ACTIONS.campusFS();
    if (S.view !== 'campus') go('campus');
    const begin = () => { if (!Campus.tour.active()){ setTimeout(begin, 80); return; }
      on = true; i = 0; token++; build(); Campus.tour.zoom(true); Campus.tour.show(); Campus.tour.focus(null); runStep(); };
    setTimeout(begin, 120);
  }
  function finish(status, goTo){
    on = false; token++; clearInterval(typer); typer = null; clearInterval(portraitT); cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKey, true); if (layer) layer.remove(); layer = null;
    Campus.tour.hide(); markSeen(status);
    if (status === 'done'){ if (!S.badges.includes('orient')){ addXP(XP.tour, 'Campus tour with BYTE'); award('orient'); } }
    else toast('Tour skipped. Replay it any time from the ⚙ menu.');
    if (!S.badges.includes('hello')) setTimeout(()=>award('hello'), 300);
    if (goTo) setTimeout(()=>EXTRA_ACTIONS.campusGo(goTo), 200);
  }
  return { start, shouldRun, isOn: () => on };
})();

window.EXTRA_ACTIONS = Object.assign(window.EXTRA_ACTIONS||{}, {
  tourReplay: () => { UI.menu = false; renderMenu(); Tour.start(); }
});
/* ============================================================
   CYBER ARCADE — shared framework, arcade hall and game runner
   ============================================================
   Games answer by MOVING (lanes, gates, bins): no pop-up quiz boxes. Each game is a module registered with
   Arcade.register(id, { controls, size, create(api) }) and gets a shared runner: intro + difficulty, HUD
   (score, lives, question bar), keyboard / on-screen buttons / swipe input, pause, results with mistakes,
   rewards (XP by accuracy and completion, a badge per game, local high scores) and retro Web Audio sound.

   A game's create(api) returns { update(dt), draw(g), input(dir), destroy?() }. The api gives:
     W, H (logical canvas size), diff {id, t, speed, lives}, questions(n, mods), sortSet(id),
     prompt(text, small), answer(ok, {q, chosen, correct, e}), loseLife(), addScore(n),
     score(), lives(), sfx(name), end(won, note), flash(colour) */
const ARCADE_SCORE_KEY = 'cybersity-arcade-scores', ARCADE_MUTE_KEY = 'cybersity-arcade-mute';
const ARCADE_DIFF = {
  easy:   {id:'easy',   t:'Easy',   speed:0.75, lives:5, note:'Slower, 5 lives'},
  normal: {id:'normal', t:'Normal', speed:1,    lives:3, note:'Standard speed, 3 lives'},
  hard:   {id:'hard',   t:'Hard',   speed:1.3,  lives:2, note:'Faster, 2 lives'}
};

const Arcade = (() => {
  const games = {};
  let audio = null, muted = false;
  try { muted = localStorage.getItem(ARCADE_MUTE_KEY) === '1'; } catch(e){}

  /* ---- scores (this device only) ---- */
  const scores = () => { try { return JSON.parse(localStorage.getItem(ARCADE_SCORE_KEY)) || {}; } catch(e){ return {}; } };
  function saveScore(id, score, acc){ const all = scores(), prev = all[id], best = !prev || score > prev.best;
    all[id] = { best: best ? score : prev.best, acc: best ? acc : prev.acc, plays: (prev ? prev.plays : 0) + 1 };
    try { localStorage.setItem(ARCADE_SCORE_KEY, JSON.stringify(all)); } catch(e){} return best; }
  function resetScores(){ try { localStorage.removeItem(ARCADE_SCORE_KEY); } catch(e){} }

  /* ---- retro sound: Web Audio, created on the first click so browsers allow it ---- */
  function unlockAudio(){ try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch(e){} }
  function tone(f, dur, type='square', vol=0.05, at=0, slide=0){
    const t = audio.currentTime + at, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.linearRampToValueAtTime(f + slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + 0.02); }
  const SFX = {
    move:  () => tone(700, 0.04, 'square', 0.025),
    ok:    () => { tone(523, 0.07); tone(659, 0.07, 'square', 0.05, 0.07); tone(988, 0.12, 'square', 0.05, 0.14); },
    bad:   () => tone(220, 0.25, 'sawtooth', 0.06, 0, -120),
    life:  () => { tone(330, 0.1, 'triangle', 0.07); tone(196, 0.2, 'triangle', 0.07, 0.1); },
    start: () => { [392, 523, 659, 784].forEach((f,i)=>tone(f, 0.08, 'square', 0.04, i*0.08)); },
    win:   () => { [523, 659, 784, 1047, 784, 1047].forEach((f,i)=>tone(f, 0.12, 'square', 0.05, i*0.11)); },
    lose:  () => { [392, 330, 262, 196].forEach((f,i)=>tone(f, 0.18, 'triangle', 0.06, i*0.15)); },
    tick:  () => tone(1200, 0.03, 'square', 0.02),
    click: () => tone(900, 0.025, 'square', 0.015),
    coin:  () => { tone(988, 0.06, 'square', 0.035); tone(1319, 0.12, 'square', 0.035, 0.06); }
  };
  function sfx(n){ if (muted || !audio || !SFX[n]) return; try { SFX[n](); } catch(e){} }
  function setMuted(m){ muted = m; try { localStorage.setItem(ARCADE_MUTE_KEY, m ? '1' : '0'); } catch(e){} }

  /* ---- question helpers ---- */
  function questions(n, mods){ const pool = shuffle(ARCADE_QS.filter(q => !mods || mods.includes(q.m)));
    const out = []; while (out.length < n) out.push(...pool); // repeat the bank for very long runs
    return out.slice(0, n).map(q => ({ q:q.q, e:q.e, correct:q.o[0], options:shuffle(q.o) })); }
  const sortSet = id => { const s = ARCADE_SORT.find(x => x.id === id) || ARCADE_SORT[0]; return { ...s, items: shuffle(s.items) }; };

  /* ---- availability ---- */
  const meta = id => ARCADE_GAMES.find(g => g.id === id);
  function status(id){
    if (!games[id]) return { ok:false, label:'Coming soon' };
    if (id === 'virus' && !(modPassed(MODULES[1]) || S.arcadeUnlocked || incActive())) return { ok:false, label:'Unlocks after Module 2' };
    return { ok:true, label:'Ready to play' };
  }

  /* ---- sample leaderboard: the player's best mixed with simulated learners ---- */
  function leaderboard(id){
    const base = {virus:2600, rocket:1900, packet:1500}[id] || 1500;
    const rows = COMMUNITY_USERS.slice(0, 7).map((u, i) => ({ name:u.name, look:u.look, score: Math.round(base * (1 - i*0.11) / 10) * 10 }));
    const mine = scores()[id]; if (mine && S.user) rows.push({ name:S.user.name, look:S.user.look, score:mine.best, me:true });
    return rows.sort((a, b) => b.score - a.score).slice(0, 8);
  }
  return { games, register:(id, mod)=>{ games[id] = mod; }, scores, saveScore, resetScores, unlockAudio, sfx, setMuted, isMuted:()=>muted,
    questions, sortSet, meta, status, leaderboard, ctx:()=>audio };
})();

/* ---------- Arcade cabinet art (pixel art drawn in code) ---------- */
function drawCabinet(cv, game, blink){
  const g = cv.getContext('2d'), s = 3; g.imageSmoothingEnabled = false; g.setTransform(s,0,0,s,0,0); g.clearRect(0,0,64,84);
  const c = game.color, dark = shade(c, -0.55), mid = shade(c, -0.25), ok = Arcade.status(game.id).ok;
  g.fillStyle = '#05061a'; g.fillRect(6,1,52,82); // outline
  g.fillStyle = mid; g.fillRect(7,2,50,80); g.fillStyle = dark; g.fillRect(7,2,4,80); g.fillRect(53,2,4,80);
  g.fillStyle = c; g.fillRect(9,4,46,10); g.fillStyle = '#05061a'; g.fillRect(9,14,46,1); // marquee
  g.fillStyle = '#ffffffaa'; for (let x=12; x<52; x+=6) g.fillRect(x, 6+(x%12===0?1:0), 3, 1);
  g.fillStyle = '#05061a'; g.fillRect(11,17,42,32); g.fillStyle = '#070a1f'; g.fillRect(12,18,40,30); // screen
  arcadeScreenArt(g, game.id, 12, 18, ok, blink);
  g.fillStyle = dark; g.fillRect(9,52,46,12); g.fillStyle = '#05061a'; g.fillRect(9,52,46,1); // control panel
  g.fillStyle = '#05061a'; g.fillRect(18,55,2,6); g.fillStyle = '#ff5d6e'; g.fillRect(17,54,4,3); // joystick
  g.fillStyle = '#ffd447'; g.fillRect(34,57,4,3); g.fillStyle = '#2ee6ff'; g.fillRect(41,57,4,3); g.fillStyle = '#ff4fae'; g.fillRect(48,57,4,3);
  g.fillStyle = dark; g.fillRect(13,68,38,10); g.fillStyle = '#05061a'; g.fillRect(28,70,8,6); g.fillStyle = ok && blink ? '#ffd447' : '#5a6199'; g.fillRect(30,72,4,2); // coin slot
}
// The little attract-mode picture on each cabinet's screen
function arcadeScreenArt(g, id, x, y, ok, blink){
  if (id === 'virus'){ g.fillStyle = '#1d2358'; g.fillRect(x, y+18, 40, 12); g.fillStyle = '#ffd447'; for (let i=0;i<3;i++) g.fillRect(x+6+i*12, y+22, 4, 1);
    g.fillStyle = '#47f59a'; g.fillRect(x+4, y+8, 12, 10); g.fillRect(x+2, y+12, 16, 5); g.fillStyle = '#05061a'; g.fillRect(x+7, y+11, 2, 2); g.fillRect(x+12, y+11, 2, 2); g.fillRect(x+8, y+15, 5, 1);
    g.fillStyle = '#eef0fb'; g.fillRect(x+28, y+12, 4, 5); g.fillStyle = '#2ee6ff'; g.fillRect(x+28, y+17, 4, 4); }
  else if (id === 'rocket'){ for (let i=0;i<8;i++){ g.fillStyle = '#ffffff88'; g.fillRect(x+((i*13)%38)+1, y+((i*7)%28)+1, 1, 1); }
    g.fillStyle = '#eef0fb'; g.fillRect(x+6, y+13, 10, 4); g.fillStyle = '#ff4fae'; g.fillRect(x+16, y+14, 2, 2); g.fillStyle = '#ffd447'; g.fillRect(x+3, y+14, 3, 2);
    g.fillStyle = '#2ee6ff'; [4, 13, 22].forEach(gy => { g.fillRect(x+30, y+gy, 2, 5); }); }
  else { g.fillStyle = '#ff4fae'; g.fillRect(x+16, y+4, 8, 5); g.fillStyle = '#2ee6ff'; g.fillRect(x+6, y+14, 8, 5); g.fillStyle = '#ffd447'; g.fillRect(x+26, y+12, 8, 5);
    g.fillStyle = '#47f59a'; g.fillRect(x+2, y+24, 11, 5); g.fillStyle = '#ff5d6e'; g.fillRect(x+15, y+24, 11, 5); g.fillStyle = '#a46bff'; g.fillRect(x+28, y+24, 11, 5); }
  if (!ok){ g.fillStyle = '#05061acc'; g.fillRect(x, y, 40, 30); }
  if (blink){ g.font = '5px Silkscreen, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = ok ? '#ffd447' : '#9aa3da'; g.fillText(ok ? 'PRESS START' : 'LOCKED', x+20, y+3.5); }
}

  const sc = Arcade.scores(), lbGame = UI.lbGame || 'virus';
  return `<section class="arcade-hall">

    <section class="panel leaderboard"><div class="lb-head"><div class="section-title" style="margin:0">Sample leaderboard</div>

   Wrong: stumble, lose a life, the monster closes in. Every 2 right answers secures the next campus

    const W = api.W, H = api.H, FX = 16, FW = W - 32, TOP = 24, BIN_H = 26, BIN_Y = H - BIN_H - 2, JUNK_H = 13, BW_PAD = 6;
    const levels = ['saferisky', 'threats'].map(id => { const s = api.sortSet(id); return { ...s, items: s.items.slice(0, PACKET_PER_LEVEL) }; });
    const TOTAL = levels.reduce((n, l) => n + l.items.length, 0);
    let lv = 0, ii = 0, col = 0, block = null, junk = [], t = 0, count = 3.2, lastTick = 4, phase = 'play', sorted = 0, fall = 20 * api.diff.speed, fast = false, banner = null, binFlash = [], gap = 0.5;
    const bits = [], floats = [];
    const L = () => levels[lv], NB = () => L().bins.length, colW = () => FW / NB(), colX = c => FX + c*colW();
    const stackTop = c => BIN_Y - junk[c]*JUNK_H;

    function startLevel(){ junk = L().bins.map(() => 0); binFlash = L().bins.map(() => 0); col = Math.floor(NB()/2); banner = { text:`LEVEL ${lv+1}: ${L().t.toUpperCase()}`, t:2 }; }
    function spawn(){
      const it = L().items[ii]; col = Math.min(col, NB()-1); fast = false;
      block = { it, y: TOP - 4, landed:false };
      const next = L().items[ii+1] || (levels[lv+1] && levels[lv+1].items[0]);
      api.prompt(it.t, `Level ${lv+1} · ${L().t} · packet ${sorted+1} of ${TOTAL}` + (next ? ` · next: ${next.t}` : ''));
    }
    function land(){
      const bin = L().bins[col], ok = bin === block.it.b, cx = colX(col) + colW()/2;
      api.answer(ok, { q:`Sort: ${block.it.t}`, chosen:bin, correct:block.it.b, e:block.it.e }); sorted++;
      if (ok){ const pts = 100 + (junk[col] ? 50 : 0); api.addScore(pts); binFlash[col] = 0.6; if (junk[col]) junk[col]--;
        floats.push({ text:'+' + pts, x:cx, y:BIN_Y-10, t:1, c:'#47f59a' });
        for (let i=0;i<16;i++) bits.push({ x:cx, y:BIN_Y, vx:(Math.random()-0.5)*120, vy:-40-Math.random()*90, t:0.8, c:PACKET_BIN_COLORS[bin] || '#47f59a' }); }
      else { junk[col]++; binFlash[col] = -0.6; floats.push({ text:`→ ${block.it.b}`, x:cx, y:stackTop(col)-8, t:1.3, c:'#ff9aa8' });
        if (junk[col] >= PACKET_STACK){ junk[col] = 0; banner = { text:'OVERFLOW!', t:1.2, red:true }; api.loseLife(); } }
      block = null; fall *= 1.06; gap = 0.45;
      if (api.lives() <= 0){ phase = 'lost'; api.prompt(''); return; }
      ii++;
      if (ii >= L().items.length){ if (lv + 1 < levels.length){ lv++; ii = 0; startLevel(); gap = 1.6; }
        else { phase = 'won'; api.prompt(''); api.end(true, `You sorted all ${TOTAL} packets before the stack overflowed!`); } }
    }
    function fitLines(g, text, w, h, base){ const words = text.split(' '); let fs = base, lines;
      for (;;){ g.font = `${fs}px "Jersey 10", monospace`; lines = []; let cur = '';
        words.forEach(wd => { const tryL = cur ? cur + ' ' + wd : wd; if (g.measureText(tryL).width > w && cur){ lines.push(cur); cur = wd; } else cur = tryL; }); lines.push(cur);
        if ((lines.length*fs*0.95 <= h && lines.every(l => g.measureText(l).width <= w)) || fs < 6) return { lines, fs }; fs *= 0.9; } }
    function tick(dt){
      t += dt; binFlash = binFlash.map(f => f > 0 ? Math.max(0, f - dt) : Math.min(0, f + dt));
      if (banner && (banner.t -= dt) <= 0) banner = null;
      bits.forEach(b => { b.t -= dt; b.x += b.vx*dt; b.y += b.vy*dt; b.vy += 200*dt; }); for (let i=bits.length-1;i>=0;i--) if (bits[i].t <= 0) bits.splice(i,1);
      floats.forEach(f => { f.t -= dt; f.y -= 20*dt; }); for (let i=floats.length-1;i>=0;i--) if (floats[i].t <= 0) floats.splice(i,1);
    }
    function draw(g){
      g.fillStyle = '#070a1f'; g.fillRect(0, 0, W, H);
      for (let y = TOP; y < BIN_Y; y += 8){ g.fillStyle = '#10153b'; g.fillRect(FX, y, FW, 1); } // data grid
      for (let c=0; c<=NB(); c++){ g.fillStyle = '#1d2358'; g.fillRect(FX + c*colW() - 1, TOP, 2, BIN_Y - TOP); }
      g.fillStyle = '#ff5d6e55'; const dangerY = BIN_Y - PACKET_STACK*JUNK_H; for (let x = FX; x < FX+FW; x += 8) g.fillRect(x, dangerY, 4, 1); // overflow line
      // highlight the current column
      if (block){ g.fillStyle = '#2ee6ff14'; g.fillRect(colX(col)+1, TOP, colW()-2, BIN_Y-TOP); }
      // junk stacks
      for (let c=0; c<NB(); c++) for (let j=0; j<junk[c]; j++){ const x = colX(c) + BW_PAD/2, y = BIN_Y - (j+1)*JUNK_H, w = colW() - BW_PAD;
        g.fillStyle = '#05061a'; g.fillRect(x, y, w, JUNK_H-1); g.fillStyle = '#3a4166'; g.fillRect(x+1, y+1, w-2, JUNK_H-3);
        g.strokeStyle = '#5a6199'; g.lineWidth = 1; g.beginPath(); g.moveTo(x+4, y+3); g.lineTo(x+w-4, y+JUNK_H-4); g.moveTo(x+w-4, y+3); g.lineTo(x+4, y+JUNK_H-4); g.stroke(); }
      // bins
      L().bins.forEach((b, c) => { const x = colX(c) + 2, w = colW() - 4, col0 = PACKET_BIN_COLORS[b] || '#2ee6ff', fl = binFlash[c];
        g.fillStyle = '#05061a'; g.fillRect(x-1, BIN_Y-1, w+2, BIN_H+2); g.fillStyle = fl > 0 ? '#47f59a' : fl < 0 ? '#ff5d6e' : shade(col0, -0.45); g.fillRect(x, BIN_Y, w, BIN_H);
        g.fillStyle = col0; g.fillRect(x, BIN_Y, w, 3); g.font = '15px "Jersey 10", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText(b.toUpperCase(), x + w/2, BIN_Y + BIN_H/2 + 2); });
      // the falling packet
      if (block){ const w = colW() - BW_PAD, x = colX(col) + BW_PAD/2, h = 30, y = block.y;
        g.fillStyle = '#2ee6ff22'; g.fillRect(x, y + h, w, stackTop(col) - y - h); // drop guide
        g.fillStyle = '#05061a'; g.fillRect(x-1, y-1, w+2, h+2); g.fillStyle = '#2ee6ff'; g.fillRect(x, y, w, h); g.fillStyle = '#0b0f2c'; g.fillRect(x+2, y+2, w-4, h-4);
        g.fillStyle = '#ffd447'; g.fillRect(x+3, y+3, 4, 4);
        const { lines, fs } = fitLines(g, block.it.t, w - 12, h - 6, 14); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
        lines.forEach((l, i) => g.fillText(l, x + w/2, y + h/2 + 1 + (i - (lines.length-1)/2) * fs*0.95)); }
      bits.forEach(b => { g.globalAlpha = Math.max(0, b.t/0.8); g.fillStyle = b.c; g.fillRect(b.x, b.y, 2, 2); }); g.globalAlpha = 1;
      floats.forEach(f => { g.globalAlpha = Math.max(0, Math.min(1, f.t)); g.font = '14px "Jersey 10", monospace'; g.textAlign = 'center'; g.fillStyle = '#05061a'; g.fillText(f.text, f.x+1, f.y+1); g.fillStyle = f.c; g.fillText(f.text, f.x, f.y); }); g.globalAlpha = 1;
      // top strip
      g.fillStyle = '#05061acc'; g.fillRect(0, 0, W, 20); g.font = '7px Silkscreen, monospace'; g.textBaseline = 'middle';
      g.textAlign = 'left'; g.fillStyle = '#e9ecff'; g.fillText(`LEVEL ${lv+1} · ${L().t.toUpperCase()}`, 6, 10);
      g.textAlign = 'right'; g.fillText(`SORTED ${sorted}/${TOTAL}`, W-6, 10);
      const big = (txt, colr, size, y = H*0.42) => { g.font = `${size}px "Jersey 10", monospace`; g.textAlign = 'center'; g.textBaseline = 'middle'; const w = g.measureText(txt).width;
        g.fillStyle = '#05061acc'; g.fillRect(W/2 - w/2 - 10, y - size*0.6, w + 20, size*1.15); g.fillStyle = '#000'; g.fillText(txt, W/2+2, y+2); g.fillStyle = colr; g.fillText(txt, W/2, y); };
      if (count > 0 && phase === 'play') big(count > 0.9 ? String(Math.ceil(count - 0.9)) : 'SORT!', count > 0.9 ? '#ffd447' : '#ff4fae', 40);
      else if (banner) big(banner.text, banner.red ? '#ff5d6e' : '#ffd447', Math.min(28, 520/banner.text.length));
      if (phase === 'won') big('ALL PACKETS SORTED!', '#47f59a', 30);
      if (phase === 'lost') big('STACK OVERFLOW!', '#ff5d6e', 36);
    }
    startLevel();
    return {
      update(dt){
        tick(dt);
        if (count > 0){ count -= dt; const n = Math.ceil(count - 0.9); if (n !== lastTick && n > 0){ lastTick = n; api.sfx('tick'); } return; }
        if (!block){ gap -= dt; if (gap <= 0 && phase === 'play') spawn(); return; }
        block.y += fall * (fast ? 6 : 1) * dt;
        if (block.y + 30 >= stackTop(col)){ block.y = stackTop(col) - 30; land(); }
      },
      after(dt){ tick(dt); },
      draw,
      input(dir){ if (phase !== 'play' || !block) return;
        if (dir === 'down'){ fast = true; return; }
        const nc = Math.max(0, Math.min(NB()-1, col + (dir === 'left' ? -1 : 1)));
        if (nc !== col && block.y + 30 < stackTop(nc)){ col = nc; api.sfx('move'); } },
      // for tests: current column, the right bin's column and progress
      state: () => ({ col, correctCol: block ? L().bins.indexOf(block.it.b) : null, sorted, phase, total:TOTAL })
    };
  }
});
/* ============================================================
   REWARDS & COMPANION — coins, daily/weekly quests, day streak, coin shop,
   UI sound and chiptune music, reward fly-ups, notifications bell, BYTE tips
   ============================================================
   Coins come with every XP reward (1 coin per 5 XP) plus quest rewards. Quests track real actions: addXP() and
   go() call Quests.track() with the XP reason (e.g. "Completed lesson: …") or "visit:<view>". */
const dayKey = (d = new Date()) => d.toLocaleDateString('en-CA');
function weekKey(d = new Date()){ const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return dayKey(x); } // Monday of this week
const ARCADE_RE = /^(Virus Escape|Rocket Firewall|Packet Drop):/;
const QUEST_POOL = [
  {id:'lesson',    t:'Complete a lesson',            icon:'book',  match:/^Completed lesson/,     need:1, xp:40, coins:15, go:'library'},
  {id:'activity',  t:'Finish a practice activity',   icon:'flag',  match:/^Activity complete/,    need:1, xp:30, coins:10, go:'challenge'},
  {id:'quiz',      t:'Pass a quiz',                  icon:'check', match:/^Passed (quiz|Module)/, need:1, xp:40, coins:15, go:'challenge'},
  {id:'arcade',    t:'Play an arcade game',          icon:'star',  match:ARCADE_RE,               need:1, xp:40, coins:15, go:'challenge'},
  {id:'byte',      t:'Ask BYTE a question',          icon:'chip',  match:/^Asked BYTE/,           need:1, xp:20, coins:10, go:'mentor'},
  {id:'community', t:'Visit the Community Hub',      icon:'chat',  match:/^visit:community$/,     need:1, xp:20, coins:10, go:'community'},
  {id:'home',      t:'Do a Home Base safety action', icon:'home',  match:/^Home Base:/,           need:1, xp:20, coins:10, go:'home'}
];
const WEEKLY_QUESTS = [
  {id:'w_lessons', t:'Complete 3 lessons',  icon:'book',   match:/^Completed lesson/, need:3,   xp:120, coins:60, go:'library'},
  {id:'w_arcade',  t:'Play 5 arcade games', icon:'star',   match:ARCADE_RE,           need:5,   xp:120, coins:60, go:'challenge'},
  {id:'w_xp',      t:'Earn 500 XP',         icon:'trophy', xpGoal:true,               need:500, xp:100, coins:50, go:'dashboard'}
];
const DAILY_BONUS = { xp:50, coins:30 };

const Quests = (() => {
  let busy = false;
  const def = id => QUEST_POOL.find(x => x.id === id) || WEEKLY_QUESTS.find(x => x.id === id);
  function pickDaily(d){ let h = 0; for (const ch of d) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    const pool = QUEST_POOL.slice(), out = []; while (out.length < 3){ out.push(pool.splice(h % pool.length, 1)[0]); h = (h*1103515245 + 12345) >>> 0; } return out; }
  // today's and this week's quests, refreshed when the date changes
  function state(){ const d = dayKey(), w = weekKey(), m = S.missions || (S.missions = {});
    if (m.day !== d){ m.day = d; m.daily = pickDaily(d).map(x => ({ id:x.id, n:0, done:false })); m.bonus = false; }
    if (m.week !== w){ m.week = w; m.weekly = WEEKLY_QUESTS.map(x => ({ id:x.id, n:0, done:false })); }
    return m; }
  function track(key, xp = 0){
    if (!S.user || busy) return; const m = state(), done = [];
    [...m.daily, ...m.weekly].forEach(it => { if (it.done) return; const q = def(it.id);
      if (q.xpGoal){ if (!xp) return; it.n = Math.min(q.need, it.n + xp); } else if (q.match.test(key)) it.n = Math.min(q.need, it.n + 1); else return;
      if (it.n >= q.need){ it.done = true; done.push(q); S.questsDone = (S.questsDone || 0) + 1; } });
    save(); if (!done.length) return;
    busy = true; // quest rewards call addXP, which must not count towards quests again
    setTimeout(() => {
      done.forEach(q => { toast(`${icon(q.icon,'#ffd447',16)} Quest complete: ${esc(q.t)} · +${q.xp} XP · +${q.coins} coins`, 'mission'); addCoins(q.coins); addXP(q.xp, 'Quest complete: ' + q.t); });
      if (!m.bonus && m.daily.every(x => x.done)){ m.bonus = true; toast('🎉 All daily quests done! Daily bonus unlocked', 'mission'); addCoins(DAILY_BONUS.coins); addXP(DAILY_BONUS.xp, 'All daily quests complete'); }
      busy = false; save(); sfx('win'); if (S.view === 'dashboard') renderView();
    }, 500);
  }
  return { state, track, def };
})();

/* ---------- coins, streak and reward fly-ups ---------- */
const coinIcon = (size = 16) => icon('coin', '#9a6400', size);
function addCoins(n){ if (!n) return; S.coins = (S.coins || 0) + n; save(); flyTo(`${coinIcon(18)} +${n}`, '#hudCoinsChip'); updateHUD(); }
function flyTo(html, sel){
  const t = document.querySelector(sel); if (!t || matchMedia('(prefers-reduced-motion: reduce)').matches){ if (t) t.classList.add('bump'); return; }
  const r = t.getBoundingClientRect(), el = document.createElement('div'); el.className = 'fly'; el.innerHTML = html; document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.transform = `translate(${r.left + r.width/2 - innerWidth/2}px, ${r.top + r.height/2 - innerHeight*0.45}px) scale(.6)`; el.style.opacity = '0.3'; });
  setTimeout(() => { el.remove(); t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); }, 700);
}
function touchStreak(){
  if (!S.user) return; const d = dayKey(), st = S.streak || (S.streak = { n:0, last:null, best:0 }); if (st.last === d) return;
  const y = new Date(); y.setDate(y.getDate() - 1); st.n = st.last === dayKey(y) ? st.n + 1 : 1; st.last = d; st.best = Math.max(st.best || 0, st.n); save();
  if (st.n > 1) setTimeout(() => toast(`🔥 ${st.n}-day streak! Keep it going`, 'mission'), 1200);
}

/* ---------- sound: UI effects reuse the arcade's Web Audio; chiptune music is optional ---------- */
const sfx = n => { if (window.Arcade) Arcade.sfx(n); };
const MUSIC_KEY = 'cybersity-music';
const Music = (() => {
  let timer = null, step = 0, next = 0;
  const N = n => n === '-' ? 0 : 440 * Math.pow(2, ('C C#D D#E F F#G G#A A#B '.indexOf(n.slice(0, -1).padEnd(2)) / 2 + (+n.slice(-1)) * 12 - 57) / 12);
  const LEAD = 'E5 - G5 - A5 - G5 E5 D5 - E5 - C5 - - - E5 - G5 - B5 - A5 G5 E5 - D5 - E5 - - - C5 - E5 - G5 - E5 C5 D5 - F5 - A5 - - - G5 - E5 - D5 - C5 - D5 E5 - - C5 - - -'.split(' ');
  const BASS = 'C3 C3 G2 G2 A2 A2 F2 G2'.split(' ');
  function note(ctx, f, t, d, type, vol){ if (!f) return; const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d + 0.02); }
  function tick(){ const ctx = Arcade.ctx(); if (!ctx) return; const len = 60 / 112 / 2;
    if (next < ctx.currentTime) next = ctx.currentTime + 0.05;
    while (next < ctx.currentTime + 0.15){ note(ctx, N(LEAD[step % LEAD.length]), next, len*0.9, 'square', 0.018);
      if (step % 4 === 0) note(ctx, N(BASS[(step/4|0) % BASS.length]), next, len*3.6, 'triangle', 0.05); next += len; step++; } }
  const isOn = () => { try { return localStorage.getItem(MUSIC_KEY) === 'on'; } catch(e){ return false; } };
  function start(){ if (timer) return; Arcade.unlockAudio(); timer = setInterval(tick, 40); }
  function stop(){ clearInterval(timer); timer = null; }
  function toggle(){ const on = !isOn(); try { localStorage.setItem(MUSIC_KEY, on ? 'on' : 'off'); } catch(e){} on ? start() : stop(); return on; }
  return { start, stop, toggle, isOn };
})();
// first click anywhere unlocks audio (and resumes music if it was on); clicks on buttons give a soft tick
document.addEventListener('pointerdown', e => { if (!window.Arcade) return; Arcade.unlockAudio(); if (Music.isOn()) Music.start();
  const b = e.target.closest('button, [data-act]'); if (b && !b.closest('.arc-pad, #arcCanvas')) sfx('click'); }, true);

  if (d.includes('lights')) for (let i = 0; i < w+6; i += 5){ g.fillStyle = ['#ff4fae','#ffd447','#2ee6ff','#47f59a'][((i/5) + Math.floor(t*3)) % 4]; g.fillRect(x-3+i, y+22 + ((i/5) % 2), 2, 2); }
  if (d.includes('flag')){ const wv = Math.round(Math.sin(t*4)); g.fillStyle = '#05061a'; g.fillRect(x+w-8, y-18, 2, 19); g.fillStyle = '#ff4fae'; g.fillRect(x+w-6, y-18+wv, 11, 7); g.fillStyle = '#fff'; g.fillRect(x+w-3, y-16+wv, 4, 3); }

    ${['Avatar', 'Home Base', 'BYTE'].map(cat => `<div class="section-title" style="margin-top:22px">${cat}</div><div class="shop-grid">${SHOP_ITEMS.filter(i => i.cat === cat).map(card).join('')}</div>`).join('')}
