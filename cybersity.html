<title>Cybersity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Lexend:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: neon night-campus arcade. Fixed HUD bar on top, one "stage" below.
   Game surfaces (campus, avatars, badges) are pixel art; reading surfaces are soft-white CRT "monitor" panels. */
:root{
  --night:#090c22; --navy:#10153b; --panel:#171d4d; --panel-2:#1f2766; --line:#303b8f; --line-soft:#252e73;
  --cyan:#2ee6ff; --blue:#4c78ff; --pink:#ff4fae; --purple:#a46bff; --gold:#ffd447; --green:#47f59a; --red:#ff5d6e; --orange:#ff9a3d;
  --paper:#eef0fb; --paper-2:#dfe3f7; --ink:#151a3e; --ink-2:#4a5180; --muted:#9aa3da; --text:#e9ecff;
  --f-pixel:'Press Start 2P', 'Courier New', monospace;
  --f-title:'Jersey 10', 'Press Start 2P', 'Courier New', monospace; /* titles, logo and big numbers */
  --f-label:'Silkscreen', 'Courier New', monospace;
  --f-body:'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-term:'VT323', 'Courier New', monospace;
  --hard: 4px 4px 0 #000;
  /* accent colours used as text; Day mode deepens them so they stay readable on light panels */
  --cyan-ink:var(--cyan); --blue-ink:var(--blue); --pink-ink:var(--pink); --purple-ink:var(--purple); --gold-ink:var(--gold); --green-ink:var(--green); --red-ink:var(--red); --orange-ink:var(--orange);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--night); color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #ffffff88 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, #ffffff66 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 38% 62%, #2ee6ff55 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 44%, #ffffff55 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 22% 84%, #ff4fae55 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 30%, #ffffff44 50%, transparent 51%),
    radial-gradient(ellipse at 50% -10%, #1d2366 0%, transparent 60%);
  background-attachment:fixed;
  overflow-x:hidden;
}
body::after{ /* subtle CRT scanlines */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
img.px, canvas.px{image-rendering:pixelated; image-rendering:crisp-edges}
h1,h2,h3{text-wrap:balance; margin:0}
p{margin:0}
.pixel{font-family:var(--f-title); letter-spacing:.03em; line-height:1.1}
.label{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.08em; font-size:12px}
.term{font-family:var(--f-term); font-size:20px; line-height:1.1}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--f-label); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:13px;
  padding:11px 18px; border:3px solid #000; background:var(--cyan); color:#05071a;
  box-shadow:var(--hard); transition:transform .08s, box-shadow .08s, filter .15s; white-space:nowrap;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 #000}
.btn.pink{background:var(--pink); color:#fff}
.btn.gold{background:var(--gold)}
.btn.purple{background:var(--purple); color:#fff}
.btn.green{background:var(--green)}
.btn.ghost{background:var(--panel-2); color:var(--text); border-color:#000}
.btn.small{padding:7px 12px; font-size:11px}
.btn[disabled]{background:#2a3070; color:#7b83b8; cursor:not-allowed; filter:none}
.btn[disabled]:active{transform:none; box-shadow:var(--hard)}
.btn img{width:18px;height:18px}

/* ---------- Panels ---------- */
.panel{background:var(--panel); border:3px solid #000; box-shadow:var(--hard), inset 0 0 0 2px var(--line-soft); padding:20px}
.monitor{ /* reading surface */
  background:var(--paper); color:var(--ink); border:4px solid #000;
  box-shadow: 0 0 0 4px #9fb6e8, 0 0 0 8px #000, 8px 8px 0 8px #000;
  padding:28px; margin:8px;
}
.monitor h2{font-family:var(--f-body); font-weight:700; font-size:26px; color:var(--ink)}
.monitor .kicker{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.1em; font-size:12px; color:#5b45c9}

/* ---------- App layout ---------- */
#app{min-height:100%; display:flex; flex-direction:column}
.hud{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  background:linear-gradient(#0d1135,#0b0f2c); border-bottom:3px solid #000; box-shadow:0 3px 0 var(--line-soft);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:10px; display:flex; align-items:center; gap:16px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:#0d1135}
.logo{font-family:var(--f-title); font-size:30px; line-height:1; letter-spacing:.04em; color:#fff; text-shadow:2px 2px 0 var(--pink), -1px -1px 0 var(--cyan); white-space:nowrap; background:none; border:0; padding:4px 0}
.logo span{color:var(--cyan-ink)}
.nav{display:flex; gap:4px; overflow-x:auto; flex:1; min-width:0; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  display:flex; align-items:center; gap:7px; padding:7px 10px; background:transparent; border:2px solid transparent;
  font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); white-space:nowrap;
}
.nav button img{width:18px;height:18px}
.nav button:hover{color:#fff; border-color:var(--line)}
.nav button.on{color:#fff; background:var(--panel-2); border-color:#000; box-shadow:2px 2px 0 #000}
.player-chip{display:flex; align-items:center; gap:10px; background:var(--panel); border:2px solid #000; padding:4px 10px 4px 4px; box-shadow:2px 2px 0 #000; cursor:pointer}
.player-chip .ava{width:34px; height:34px; background:#232b72; border:2px solid #000; display:grid; place-items:center; overflow:hidden}
.player-chip .ava img{width:28px; height:36px; margin-top:6px}
.lvl{font-family:var(--f-pixel); font-size:9px; color:var(--gold-ink)}
.xpbar{width:110px; height:10px; background:#05071a; border:2px solid #000; position:relative; margin-top:4px}
.xpbar i{position:absolute; inset:0 auto 0 0; background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#ffb800 6px 8px); transition:width .6s}
.icon-btn{width:40px;height:40px; display:grid; place-items:center; background:var(--panel); border:2px solid #000; box-shadow:2px 2px 0 #000}
.icon-btn img{width:20px;height:20px}

.stage{flex:1; width:100%; max-width:1180px; margin:0 auto; padding-block:24px 110px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.page-head h1{font-family:var(--f-title); font-size:44px; line-height:1; letter-spacing:.03em; color:#fff; text-shadow:3px 3px 0 #000}
.page-head p{color:var(--muted); max-width:62ch; margin-top:8px}
.crumbs{font-family:var(--f-label); font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; display:flex; gap:8px; flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--cyan-ink);padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit}

.grid{display:grid; gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){ .g2,.g3{grid-template-columns:1fr} }
.g-wide{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)} .g-cert{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
@media (max-width:860px){ .g-wide,.g-cert{grid-template-columns:1fr} }
@media (max-width:1100px) and (min-width:861px){ .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- Auth / onboarding ---------- */
.auth{min-height:100%; display:grid; place-items:center; padding-block:32px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.auth-wrap{width:100%; max-width:980px; display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:center}
@media (max-width:860px){ .auth-wrap{grid-template-columns:1fr} }
.hero-logo{font-family:var(--f-title); font-size:clamp(64px,12vw,120px); line-height:.9; letter-spacing:.04em; color:#fff;
  text-shadow:4px 4px 0 var(--pink), -2px -2px 0 var(--cyan), 8px 8px 0 #000}
.hero-tag{font-family:var(--f-label); color:var(--cyan-ink); text-transform:uppercase; letter-spacing:.12em; margin-top:18px; font-size:14px}
.hero-copy{color:var(--muted); margin-top:14px; max-width:46ch; font-size:16px}
.hero-pills{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.pill{font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:5px 9px; border:2px solid #000; background:var(--panel-2); color:var(--text); box-shadow:2px 2px 0 #000}
.pill.cyan{background:#0e3f55; color:var(--cyan-ink)} .pill.pink{background:#4a1239; color:#ffb3dc} .pill.gold{background:#4a3b0b; color:var(--gold-ink)} .pill.purple{background:#30185e; color:#d6bcff} .pill.green{background:#0f3e2b; color:var(--green-ink)} .pill.red{background:#4a121c; color:#ffb0b8}
.tabs{display:flex; border:3px solid #000; margin-bottom:18px}
.tabs button{flex:1; padding:10px; background:var(--navy); border:0; font-family:var(--f-label); text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.tabs button.on{background:var(--cyan); color:#05071a; font-weight:700}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.input{background:#070a1f; border:3px solid #000; box-shadow:inset 0 0 0 2px var(--line-soft); padding:11px 12px; color:#fff; width:100%}
.input:focus{outline:none; box-shadow:inset 0 0 0 2px var(--cyan)}
.note{font-size:12px; color:var(--muted)}

.creator{display:grid; grid-template-columns:260px 1fr; gap:24px}
@media (max-width:760px){ .creator{grid-template-columns:1fr} }
.ava-stage{background:radial-gradient(circle at 50% 70%, #2a3290 0%, #10153b 70%); border:3px solid #000; box-shadow:var(--hard); display:grid; place-items:center; padding:20px; position:relative; min-height:280px}
.ava-stage img{width:140px; height:180px}
.ava-stage .floor{position:absolute; bottom:38px; width:120px; height:14px; background:#0006; border-radius:50%}
.opt-row{margin-bottom:16px}
.opt-row .label{color:var(--muted); margin-bottom:8px; display:block}
.swatches{display:flex; flex-wrap:wrap; gap:8px}
.sw{width:34px; height:34px; border:3px solid #000; box-shadow:2px 2px 0 #000}
.sw.on{outline:3px solid var(--gold); outline-offset:1px}
.chip{padding:7px 11px; border:2px solid #000; background:var(--panel-2); font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.06em; box-shadow:2px 2px 0 #000}
.chip.on{background:var(--gold); color:#05071a}

.briefing{max-width:760px; margin:0 auto; text-align:center}
.flow{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin:26px 0}
@media (max-width:700px){ .flow{grid-template-columns:repeat(2,minmax(0,1fr))} }
.flow div{background:var(--panel); border:3px solid #000; box-shadow:3px 3px 0 #000; padding:14px 8px}
.flow b{display:block; font-family:var(--f-pixel); font-size:10px; margin-top:10px}
.flow small{display:block; color:var(--muted); font-size:12px; margin-top:6px}
.flow img{width:30px;height:30px}

/* ---------- Dashboard ---------- */
.welcome{display:grid; grid-template-columns:auto 1fr auto; gap:22px; align-items:center;
  background:linear-gradient(120deg,#1c1f6b 0%,#2a1460 60%,#4a1446 100%); border:3px solid #000; box-shadow:var(--hard); padding:22px; position:relative; overflow:hidden}
.welcome::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg,transparent 0 23px,#ffffff08 23px 24px), repeating-linear-gradient(0deg,transparent 0 23px,#ffffff08 23px 24px); pointer-events:none}
.welcome .big-ava{width:96px; height:96px; background:#0b0f2c; border:3px solid #000; display:grid; place-items:center; overflow:hidden}
.welcome .big-ava img{width:64px; height:82px; margin-top:16px}
.welcome h1{font-family:var(--f-title); font-size:38px; line-height:1}
@media (max-width:700px){ .welcome{grid-template-columns:1fr} }
.stat{display:flex; flex-direction:column; gap:4px}
.stat b{font-family:var(--f-title); font-size:38px; line-height:1; color:#fff}
.stat span{font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.stats-row{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
@media (max-width:700px){ .stats-row{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stats-row .panel{padding:14px 16px}
.bar{height:12px; background:#05071a; border:2px solid #000; position:relative; overflow:hidden}
.bar i{position:absolute; inset:0 auto 0 0; background:var(--cyan); transition:width .6s}
.bar.gold i{background:var(--gold)} .bar.pink i{background:var(--pink)} .bar.green i{background:var(--green)} .bar.purple i{background:var(--purple)}
.section-title{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.1em; font-size:13px; color:var(--cyan-ink); margin-bottom:12px; display:flex; align-items:center; gap:8px}
.section-title::after{content:""; flex:1; height:2px; background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.mod-row{display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center; padding:10px 0; border-bottom:2px dashed var(--line-soft)}
.mod-row:last-child{border-bottom:0}
.mod-num{width:34px;height:34px; display:grid; place-items:center; font-family:var(--f-pixel); font-size:11px; border:2px solid #000; box-shadow:2px 2px 0 #000}
.tip-card{background:#0d2f3c; border:3px solid #000; box-shadow:var(--hard); padding:16px}
.tip-card .label{color:var(--cyan-ink)}

/* ---------- Campus ---------- */
.campus-wrap{position:relative; max-width:max(560px, calc((100vh - 110px) * 1.2)); margin:0 auto; border:4px solid #000; box-shadow:0 0 0 3px var(--line), 8px 8px 0 3px #000; background:#000}
#campus{display:block; width:100%; height:auto; aspect-ratio:6/5; cursor:crosshair; touch-action:manipulation}
.campus-hud{position:absolute; left:10px; top:10px; display:flex; gap:8px; flex-wrap:wrap; pointer-events:none}
.campus-hud .pill{pointer-events:auto}
/* Map buttons (top-right of the campus): gear (full screen only), Full map / Zoom in (phones), Full screen */
.cam-tools{position:absolute; right:8px; top:8px; z-index:4; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.cam-btn{display:flex; align-items:center; gap:5px; font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:6px 9px; background:#0b0f2ce6; color:var(--cyan-ink); border:2px solid #000; box-shadow:2px 2px 0 #000}
.cam-btn:hover{background:#1f2766}
.cam-toggle, .fs-only{display:none}
@media (max-width:640px){ .cam-toggle{display:flex} }
/* Full-screen campus: the shell covers the window above the top bar; menus, pop-ups and toasts stay above it */
/* Campus page: the map fills the screen under the top bar (.page), or the whole screen in full-screen mode (.fs) */
body.campus-page{overflow:hidden}
.campus-shell.page{position:fixed; left:0; right:0; bottom:0; top:var(--hud-h, 72px); z-index:40; background:#000}
.campus-shell.fs{position:fixed; inset:0; z-index:100; background:#000}
.campus-shell:is(.fs,.page) .campus-wrap{position:absolute; inset:0; max-width:none; margin:0; border:0; box-shadow:none; animation:none}
.campus-shell:is(.fs,.page) #campus{width:100%; height:100%; aspect-ratio:auto!important}
.campus-shell.fs .fs-only{display:flex} .campus-shell.fs .cam-toggle{display:none}
.campus-shell:is(.fs,.page) .cam-tools{top:calc(10px + env(safe-area-inset-top,0px)); right:calc(10px + env(safe-area-inset-right,0px))}
.campus-shell:is(.fs,.page) .campus-hud{display:flex; top:calc(10px + env(safe-area-inset-top,0px)); left:calc(10px + env(safe-area-inset-left,0px))}
@media (max-width:640px){ .campus-shell:is(.fs,.page) .campus-hud{display:none} }
.campus-shell:is(.fs,.page) #incBanner{position:absolute; z-index:5; left:50%; transform:translateX(-50%); top:calc(52px + env(safe-area-inset-top,0px)); width:min(760px, calc(100% - 24px))}
.campus-shell:is(.fs,.page) #incBanner .inc-banner{margin:0; max-width:none}
.campus-shell:is(.fs,.page) .prompt{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
/* compact incident banners floating on the map */
.campus-shell:is(.fs,.page) .inc-banner{padding:6px 10px; gap:6px 12px; width:max-content; max-width:100%; margin:0 auto}
.campus-shell:is(.fs,.page) .inc-title{font-size:20px}
.campus-shell:is(.fs,.page) .inc-count b{font-size:20px}
@media (max-width:640px){ .campus-shell:is(.fs,.page) .inc-count, .campus-shell:is(.fs,.page) .inc-chips{display:none} .campus-shell:is(.fs,.page) .inc-title{font-size:17px; min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block} .campus-shell:is(.fs,.page) .inc-banner{width:auto; flex-wrap:nowrap} .campus-shell:is(.fs,.page) .inc-title .siren{display:inline-block; vertical-align:middle; margin-right:6px} }
.campus-shell .campus-wrap.alarm{box-shadow:inset 0 0 0 4px var(--red); animation:none}
/* building dock along the bottom of the map */
.cam-dock{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:4; display:flex; gap:6px; padding:6px; background:#0b0f2ce6; border:3px solid #000; box-shadow:3px 3px 0 #000; max-width:calc(100% - 20px)}
.dock-btn{position:relative; flex:none; width:44px; height:44px; display:grid; place-items:center; background:#1f2766; border:2px solid #000; box-shadow:2px 2px 0 #000}
.dock-btn:hover, .dock-btn:focus-visible{background:#3a4596}
.dock-btn:active{transform:translate(2px,2px); box-shadow:none}
.dock-btn.locked{opacity:.6}
.dock-btn::after{content:attr(data-name); position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%); white-space:nowrap; font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:4px 8px; background:#05061a; color:#e9ecff; border:2px solid #000; box-shadow:2px 2px 0 #000; opacity:0; pointer-events:none; transition:opacity .12s}
.dock-btn:hover::after, .dock-btn:focus-visible::after{opacity:1}
@media (max-width:640px){ .dock-btn{width:34px; height:34px} .dock-btn img{width:18px; height:18px} .cam-dock{gap:4px; padding:5px} body.campus-page .fab, body.campus-page .drawer{display:none} }
/* help panel and first-visit hint */
.cam-help{position:absolute; right:10px; top:52px; z-index:6; width:min(300px, calc(100% - 20px)); padding:12px 14px; display:grid; gap:6px; background:#0b0f2cf0; color:#e9ecff; border:3px solid #000; box-shadow:3px 3px 0 #000; font-size:13.5px; line-height:1.45}
.cam-help b{font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold)}
.cam-hint{position:absolute; left:50%; top:56px; transform:translateX(-50%); z-index:4; max-width:calc(100% - 24px); padding:8px 14px; text-align:center; background:#0b0f2ce6; color:#e9ecff; border:2px solid #000; box-shadow:2px 2px 0 #000; font-size:13px; pointer-events:none; animation:hintOut .6s 6s forwards}
@keyframes hintOut{to{opacity:0; visibility:hidden}}
body.campus-fs .fab, body.campus-fs .drawer{display:none}
body.campus-fs{overflow:hidden}
.prompt{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:#0b0f2ce6; border:3px solid #000; box-shadow:var(--hard); padding:8px 10px 8px 14px; font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; font-size:12px; white-space:nowrap; max-width:calc(100% - 20px)}
.prompt kbd{font-family:var(--f-pixel); font-size:9px; background:var(--gold); color:#000; padding:4px 6px; border:2px solid #000}
.tooltip{position:absolute; pointer-events:none; background:#0b0f2cf0; border:2px solid #000; box-shadow:3px 3px 0 #000; padding:8px 10px; font-size:13px; max-width:240px; z-index:5}
.tooltip b{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; display:block; color:var(--cyan-ink)}


/* ---------- Home Base ---------- */
.home-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); align-items:start}
@media (min-width:861px){ .home-dorm{position:sticky; top:88px} }
@media (max-width:860px){ .home-grid{grid-template-columns:1fr} }
.home-dorm canvas{display:block; width:100%; max-width:384px; height:auto; margin:0 auto; border:3px solid #000}
.home-score{display:flex; align-items:baseline; gap:10px; margin:10px 0 8px}
.home-score b{font-size:52px; line-height:1; color:var(--green-ink); text-shadow:3px 3px 0 #000}
.home-stages{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:14px}
.home-stages span{font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:6px 8px; border:2px solid #000; background:var(--navy); color:var(--muted)}
.home-stages span.on{background:#0f3e2b; color:var(--green-ink)}
.hc-list{display:grid; gap:10px; margin-top:16px}
.hc{display:grid; grid-template-columns:32px 1fr auto; gap:12px; align-items:start; text-align:left; padding:12px 14px; background:#fff; color:var(--ink); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink)}
.hc:hover{background:#f4f6ff}
.hc.done{background:#c9f7de}
.hc-box{width:32px; height:32px; border:3px solid var(--ink); background:#fff; display:grid; place-items:center}
.hc.done .hc-box{background:var(--green)}
.hc-body{display:flex; flex-direction:column; gap:3px; font-size:14px; line-height:1.45; color:var(--ink-2)}
.hc-body b{font-size:16px; color:var(--ink)}
.hc-body i{font-style:normal; font-weight:600; color:var(--ink)}
.hc-xp{font-family:var(--f-label); font-size:11px; text-transform:uppercase; color:#1f7a4a; white-space:nowrap}
@media (max-width:560px){ .hc{grid-template-columns:32px 1fr} .hc-xp{grid-column:2} }
.home-card{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.home-card canvas{width:96px; height:auto; border:3px solid #000; flex:none}

/* ---------- Career Compass ---------- */
.cmedal{display:grid; place-items:center; border:3px solid #000; box-shadow:3px 3px 0 #000; clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.compass-result{display:flex; gap:18px; align-items:center; margin-top:10px; flex-wrap:wrap}
.role-grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px}
@media (max-width:1000px){ .role-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .role-grid{grid-template-columns:1fr} }
.role-card{display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left; padding:16px; background:var(--panel); border:3px solid #000; box-shadow:4px 4px 0 #000; border-top:6px solid var(--rc)}
.role-card:hover{background:var(--panel-2); transform:translate(-1px,-1px)}
.role-card b{font-family:var(--f-label); font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:#fff}
.role-card small{color:var(--muted); font-size:13px; line-height:1.35}
.role-pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:auto}
.role-head{border-left:6px solid var(--rc); padding-left:16px}
.fit-box{margin-top:16px; padding:12px 14px; background:#fff1b8; border:3px solid var(--ink); font-size:15px}
.taster{border-top:6px solid var(--rc); align-self:start}
.roadmap{list-style:none; margin:4px 0 0; padding:0; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; position:relative}
.roadmap::before{content:""; position:absolute; left:4%; right:4%; top:19px; height:4px; background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px)}
.rm{position:relative; display:flex; flex-direction:column; gap:10px}
.rm-n{flex:none; width:42px; height:42px; display:grid; place-items:center; font-family:var(--f-pixel); font-size:12px; border:3px solid #000; box-shadow:3px 3px 0 #000; background:var(--navy); color:var(--muted); z-index:1}
.rm.full .rm-n{background:var(--green)} .rm.part .rm-n{background:var(--gold); color:#05061a}
.rm:last-child .rm-n{background:var(--rc); color:#05061a}
.rm-body{display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:1.4; color:var(--muted)}
.rm-body b{font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#fff}
.rm-tag{font-family:var(--f-label); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.rm.full .rm-tag{color:var(--green-ink)} .rm.part .rm-tag{color:var(--gold-ink)}
@media (max-width:860px){
  .roadmap{grid-template-columns:1fr; gap:16px}
  .roadmap::before{left:19px; right:auto; top:8px; bottom:8px; width:4px; height:auto; background:repeating-linear-gradient(180deg,var(--line) 0 8px,transparent 8px 12px)}
  .rm{flex-direction:row; align-items:flex-start; gap:14px}
}
.other-roles{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:22px}

/* ---------- "What to do in real life" (scam lessons) ---------- */
.reallife{margin-top:22px; background:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 #b3203a; padding:18px 20px}
.rl-head{display:flex; gap:12px; align-items:center}
.rl-head .label{color:#b3203a}
.rl-head h3{font-size:20px; color:var(--ink)}
.rl-alert{flex:none; width:38px; height:38px; display:grid; place-items:center; font-family:var(--f-pixel); font-size:16px; color:#fff; background:#d8344f; border:3px solid var(--ink); box-shadow:2px 2px 0 var(--ink)}
.rl-lead{margin-top:10px; color:var(--ink-2); font-size:15px}
.rl-steps{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:10px}
.rl-steps li{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#fff1f3; border:2px solid var(--ink)}
.rl-steps li > div{display:flex; flex-direction:column; gap:3px; min-width:0; font-size:14.5px; line-height:1.45; color:var(--ink-2)}
.rl-steps b{font-size:16px; color:var(--ink)}
.rl-n{flex:none; width:30px; height:30px; display:grid; place-items:center; font-family:var(--f-pixel); font-size:11px; background:var(--gold); color:#05061a; border:2px solid var(--ink)}
.rl-call{align-self:flex-start; margin-top:8px; text-decoration:none}
.rl-foot{margin-top:12px; font-size:13.5px; color:var(--ink-2)}
@media (max-width:560px){ .reallife{padding:14px 12px} .rl-steps li{padding:10px; gap:10px} .rl-n{width:26px; height:26px} }

/* ---------- "Teach your family" card ---------- */
.family{text-align:left}
.family-card{background:#fffaf0; color:var(--ink); border:3px solid var(--ink); border-top:8px solid var(--mc); box-shadow:5px 5px 0 var(--ink); padding:16px 18px; max-width:560px}
.fc-top{display:flex; gap:12px; align-items:center}
.fc-top img{width:44px; height:44px; flex:none; background:#151a3e; border:2px solid var(--ink); padding:2px}
.fc-top .label{color:#5b45c9; font-size:11px}
.fc-top b{display:block; font-size:18px; line-height:1.3; margin-top:2px}
.fc-tips{margin:12px 0 0; padding-left:22px; display:grid; gap:6px; font-size:15px; line-height:1.45}
.fc-tips li::marker{font-weight:700; color:#5b45c9}
.fc-try{margin-top:12px; padding:10px 12px; background:#c9f7de; border:2px solid var(--ink); font-size:14.5px}
.fc-foot{margin-top:10px; font-family:var(--f-label); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2)}
.fc-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
.fc-actions a.btn{text-decoration:none}
.modal .family-card{max-width:none}
.modal .fc-actions{justify-content:center}

/* ---------- Building-themed page headers ---------- */
.bhead{position:relative; overflow:hidden; align-items:center; padding:14px 18px 14px 14px; border:3px solid #000; border-bottom:4px solid var(--bc); box-shadow:var(--hard);
  background:linear-gradient(100deg, color-mix(in srgb, var(--bc) 28%, var(--navy)) 0%, var(--navy) 62%)}
.bhead::after{content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.03) 3px 4px)}
.bhead > div:first-of-type{flex:1 1 200px; min-width:0}
.bhead h1{text-shadow:3px 3px 0 #000, 0 0 16px color-mix(in srgb, var(--bc) 55%, transparent)}
.bhead .crumbs, .bhead .crumbs button{color:color-mix(in srgb, var(--bc) 70%, #fff)}
.bhead p{color:#c3c9ee}
.bbanner{flex:none; width:173px; height:120px; border:3px solid #000; background:#0b0f2c; box-shadow:3px 3px 0 #000, 0 0 18px color-mix(in srgb, var(--bc) 50%, transparent)}
@media (max-width:560px){ .bhead{padding:12px} .bbanner{width:96px; height:67px} }

/* ---------- Campus Incident ---------- */
.inc-banner{display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; margin:0 auto 14px; max-width:max(560px, calc((100vh - 110px) * 1.2)); padding:10px 14px; background:#3a0d1a; border:3px solid #000; box-shadow:0 0 0 3px var(--red), var(--hard); animation:incPulse 1s steps(2) infinite}
.inc-banner.saved{background:#0f3e2b; box-shadow:0 0 0 3px var(--green), var(--hard); animation:none}
.inc-title{display:flex; align-items:center; gap:10px; font-family:var(--f-title); font-size:26px; letter-spacing:.04em; color:#fff; text-shadow:2px 2px 0 #000}
.inc-banner.saved .inc-title{color:var(--green-ink)}
.inc-count{font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#ffc2cb}
.inc-count b{font-family:var(--f-title); font-size:26px; color:#fff}
.inc-banner.saved .inc-count{color:var(--green-ink)}
.inc-chips{display:flex; gap:6px; flex-wrap:wrap; flex-basis:100%}
.inc-chip{font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:5px 8px; background:#5a1a26; color:#ffd6db; border:2px solid #000; box-shadow:2px 2px 0 #000}
.inc-chip:hover{background:#7a2232; color:#fff}
.inc-chip.ok{background:#0f3e2b; color:var(--green-ink); cursor:default}
.siren{width:14px; height:14px; background:var(--red); border:2px solid #000; box-shadow:0 0 12px 3px #ff5d6e; animation:siren .5s steps(2) infinite}
.campus-wrap.alarm{box-shadow:0 0 0 3px var(--red), 8px 8px 0 3px #000; animation:incGlow 1s steps(2) infinite}
.inc-head h1{color:#ffd6db; text-shadow:3px 3px 0 #5a1a26}
@keyframes siren{50%{background:#5a1a26; box-shadow:none}}
@keyframes incPulse{50%{background:#4d1222}}
@keyframes incGlow{50%{box-shadow:0 0 0 3px #7a2232, 8px 8px 0 3px #000}}

/* Laptop widths: stack nav labels under icons so all nine sections fit */
@media (min-width:761px) and (max-width:1500px){
  .nav{gap:2px}
  .nav button{flex-direction:column; gap:3px; padding:5px 6px; font-size:10px; letter-spacing:.03em}
  .nav button img{width:16px; height:16px}
}

/* ---------- Library ---------- */
.mod-card{display:flex; flex-direction:column; gap:12px; background:var(--panel); border:3px solid #000; box-shadow:var(--hard); padding:0; overflow:hidden; text-align:left; color:var(--text)}
.mod-card .cover{height:92px; position:relative; border-bottom:3px solid #000; display:flex; align-items:flex-end; justify-content:space-between; padding:12px 14px}
.mod-card .cover .n{font-family:var(--f-title); font-size:56px; line-height:1; color:#0008; text-shadow:2px 2px 0 #fff3}
.mod-card .cover img{width:48px;height:48px}
.mod-card .body{padding:0 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1}
.mod-card h3{font-size:17px; font-weight:600}
.mod-card p{color:var(--muted); font-size:13.5px}
.mod-card.locked{filter:saturate(.25) brightness(.75)}
.lock-tag{display:inline-flex; align-items:center; gap:6px}
.lesson-list{display:flex; flex-direction:column; gap:12px}
.lesson-item{display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:center; background:var(--panel); border:3px solid #000; box-shadow:3px 3px 0 #000; padding:14px}
.lesson-item .st{width:44px;height:44px; display:grid; place-items:center; border:2px solid #000; font-family:var(--f-pixel); font-size:12px}
.lesson-item h3{font-size:16px; font-weight:600}
.steps-mini{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
.steps-mini span{font-family:var(--f-label); font-size:10px; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px; border:2px solid #000; background:#0b0f2c; color:var(--muted)}
.steps-mini span.done{background:#0f3e2b; color:var(--green-ink)}
@media (max-width:600px){ .lesson-item{grid-template-columns:44px 1fr} .lesson-item > :last-child{grid-column:1/-1} }

/* ---------- Lesson ---------- */
.lesson-layout{display:grid; grid-template-columns:230px minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:900px){ .lesson-layout{grid-template-columns:1fr} }
.stepper{display:flex; flex-direction:column; gap:6px; position:sticky; top:84px}
@media (max-width:900px){ .stepper{position:static; flex-direction:row; overflow-x:auto; padding-bottom:6px} }
.stepper button{display:flex; align-items:center; gap:10px; padding:9px 10px; background:var(--panel); border:2px solid #000; text-align:left; font-size:13px; color:var(--muted); white-space:nowrap}
.stepper button .dot{width:22px;height:22px; flex:none; display:grid; place-items:center; font-family:var(--f-pixel); font-size:8px; background:#0b0f2c; border:2px solid #000; color:var(--muted)}
.stepper button.on{background:var(--panel-2); color:#fff; box-shadow:3px 3px 0 #000; border-color:#000}
.stepper button.on .dot{background:var(--cyan); color:#000}
.stepper button.done .dot{background:var(--green); color:#000}
.stepper button[disabled]{opacity:.45; cursor:not-allowed}
.lesson-body{font-size:16.5px; line-height:1.7; max-width:68ch}
.lesson-body p + p{margin-top:12px}
.concepts{display:grid; gap:12px; margin-top:18px}
.concept{display:grid; grid-template-columns:150px 1fr; gap:14px; padding:14px; background:#fff; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink)}
.concept b{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; font-size:13px; color:#5b45c9}
@media (max-width:560px){ .concept{grid-template-columns:1fr; gap:4px} }
.lesson-nav{display:flex; justify-content:space-between; gap:12px; margin-top:26px; flex-wrap:wrap}
.ask-byte{display:flex; align-items:center; gap:12px; margin-top:22px; padding:12px 14px; background:#efe6ff; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); font-size:14px}
.ask-byte img{width:34px; height:40px}
.ask-byte .btn{margin-left:auto}
@media (max-width:560px){ .ask-byte{flex-wrap:wrap} .ask-byte .btn{margin-left:0} }
.scenario-box{background:#fff; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); padding:18px; margin-top:14px}
.scenario-box .who{font-family:var(--f-label); text-transform:uppercase; font-size:12px; letter-spacing:.08em; color:#c2297c}
.choices{display:grid; gap:10px; margin-top:14px}
.choice{text-align:left; padding:12px 14px; background:var(--paper-2); border:3px solid var(--ink); color:var(--ink); font-size:15px; box-shadow:3px 3px 0 var(--ink)}
.choice:hover{background:#fff}
.choice.right{background:#c9f7de; border-color:#0b7a43}
.choice.wrong{background:#ffd6db; border-color:#b3203a}
.feedback{margin-top:12px; padding:12px 14px; border:3px solid var(--ink); font-size:14.5px}
.feedback.ok{background:#c9f7de} .feedback.bad{background:#ffe1e5}
.recap-list{display:grid; gap:8px; margin:14px 0; padding:0; list-style:none}
.recap-list li{display:flex; gap:10px}
.recap-list li::before{content:""; flex:none; width:10px; height:10px; margin-top:9px; background:#5b45c9; box-shadow:2px 2px 0 var(--ink)}
.terms{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px}
@media (max-width:600px){ .terms{grid-template-columns:1fr} }
.terms div{background:#fff; border:2px solid var(--ink); padding:10px 12px; font-size:14px}
.terms b{display:block; font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:#c2297c}

/* lesson visuals (light surface) */
.vis{background:#fff; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); padding:18px; margin-top:14px; overflow-x:auto}
.vis-cap{font-size:13.5px; color:var(--ink-2); margin-top:10px}
.vrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center}
.vbox{border:3px solid var(--ink); padding:10px 12px; text-align:center; min-width:110px; background:var(--paper); box-shadow:3px 3px 0 var(--ink); font-size:14px}
.vbox b{display:block; font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; font-size:12px}
.varrow{font-family:var(--f-pixel); font-size:12px; color:#5b45c9}
.vt-red{background:#ffd6db} .vt-blue{background:#d8e4ff} .vt-green{background:#c9f7de} .vt-gold{background:#fff1b8} .vt-purple{background:#e9dcff} .vt-cyan{background:#ccf6ff}
.vgrid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.email-mock{border:3px solid var(--ink); background:#fbfbff; font-size:14px; max-width:620px; margin:0 auto}
.email-mock .eh{background:#e6e9f8; border-bottom:2px solid var(--ink); padding:10px 12px; display:grid; gap:2px}
.email-mock .eb{padding:14px 16px; line-height:1.6}
.email-mock .lnk{color:#1d4ed8; text-decoration:underline}
.callout{display:inline-grid; place-items:center; width:20px; height:20px; background:#c2297c; color:#fff; font-family:var(--f-pixel); font-size:8px; border:2px solid var(--ink); vertical-align:middle; margin:0 3px}
.code-tbl{width:100%; border-collapse:collapse; font-family:var(--f-term); font-size:19px; min-width:520px}
.code-tbl td,.code-tbl th{border:2px solid var(--ink); padding:4px 8px; text-align:left}
.code-tbl th{background:#e6e9f8; font-family:var(--f-label); font-size:12px; text-transform:uppercase}
.hash-demo{display:grid; gap:8px; margin-top:12px}
.hash-out{font-family:var(--f-term); font-size:18px; word-break:break-all; background:var(--ink); color:var(--green-ink); padding:10px 12px; border:3px solid var(--ink)}
.hbar{display:grid; grid-template-columns:minmax(120px,240px) 1fr; gap:10px; align-items:center; font-size:14px; margin-bottom:8px}
.hbar code{font-family:var(--f-term); font-size:19px}
.hbar .track{height:22px; background:var(--paper-2); border:2px solid var(--ink); position:relative}
.hbar .track i{position:absolute; inset:0 auto 0 0; border-right:2px solid var(--ink)}
.hbar .track span{position:absolute; right:6px; top:0; font-family:var(--f-label); font-size:11px; line-height:18px}
.matrix{display:grid; grid-template-columns:auto repeat(3,minmax(70px,1fr)); gap:4px; font-size:13px; min-width:380px}
.matrix div{border:2px solid var(--ink); padding:10px 6px; text-align:center}
.matrix .h{border:0; font-family:var(--f-label); text-transform:uppercase; font-size:11px; display:grid; place-items:center}

/* ---------- Activities ---------- */
.act-head{display:flex; align-items:center; gap:12px; margin-bottom:6px}
.act-head .pill{flex:none}
.sort-card{background:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink); padding:22px; text-align:center; font-size:18px; font-weight:500; margin:18px auto; max-width:520px; min-height:96px; display:grid; place-items:center}
.buckets{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.bucket{padding:14px 10px; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; font-weight:700; font-size:13px; color:var(--ink)}
.bucket small{display:block; font-family:var(--f-body); text-transform:none; letter-spacing:0; font-weight:400; font-size:12px; margin-top:4px; color:var(--ink-2)}
.progress-dots{display:flex; gap:5px; justify-content:center; margin-top:8px; flex-wrap:wrap}
.progress-dots i{width:14px; height:14px; border:2px solid var(--ink); background:var(--paper-2)}
.progress-dots i.ok{background:#2fc77a} .progress-dots i.bad{background:#ff5d6e} .progress-dots i.cur{background:var(--gold)}
.sel-email .hot{cursor:pointer; border-bottom:2px dashed transparent; padding:1px 2px}
.sel-email .hot:hover{background:#fff1b8}
.sel-email .hot.flag{background:#ffd6db; border-bottom-color:#b3203a}
.sel-email .hot.miss{background:#fff1b8; outline:2px dashed #b38600}
.sel-email .hot.okflag{background:#c9f7de; border-bottom-color:#0b7a43}
.log-lines{display:grid; gap:4px; font-family:var(--f-term); font-size:19px; overflow-x:auto}
.log-line{display:grid; grid-template-columns:70px 1fr; gap:10px; text-align:left; padding:6px 10px; background:var(--ink); color:#cfd6ff; border:2px solid var(--ink); min-width:560px}
.log-line:hover{background:#262c66}
.log-line.flag{background:#5a1430; color:#ffd0dc}
.log-line.okflag{background:#0e4a2c; color:#c9f7de}

.match-cols{display:grid; grid-template-columns:1fr 1fr; gap:16px}

.match-cols .col{display:grid; gap:8px; align-content:start}
.mitem{text-align:left; padding:11px 12px; border:3px solid var(--ink); background:#fff; color:var(--ink); box-shadow:3px 3px 0 var(--ink); font-size:14px; display:flex; gap:10px; align-items:center}
.mitem .tag{flex:none; width:22px; height:22px; border:2px solid var(--ink); display:grid; place-items:center; font-family:var(--f-pixel); font-size:8px; background:var(--paper-2)}

.mitem.right{background:#c9f7de} .mitem.wrong{background:#ffd6db}

.router .rhead{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; border-bottom:2px dashed #3a4596; padding-bottom:10px; margin-bottom:10px}

.seg{display:flex; border:2px solid #000; flex-wrap:wrap}
.seg button{padding:7px 10px; background:#0b0f2c; border:0; font-family:var(--f-label); font-size:11px; text-transform:uppercase; color:var(--muted)}
.seg button.on{background:var(--cyan); color:#000; font-weight:700}
.setting.good .seg button.on{background:var(--green)} .setting.badset .seg button.on{background:var(--red); color:#fff}
@media (max-width:560px){ .setting{grid-template-columns:1fr} }
.pw-input{font-family:var(--f-term); font-size:26px; padding:10px 14px; width:100%; border:3px solid var(--ink); background:#fff; color:var(--ink)}
.meter{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:10px}
.meter i{height:14px; border:2px solid var(--ink); background:var(--paper-2)}
.checks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:12px; font-size:14px; padding:0; list-style:none}
@media (max-width:560px){ .checks{grid-template-columns:1fr} }
.checks li{display:flex; gap:8px; align-items:center}
.checks li::before{content:""; width:14px; height:14px; border:2px solid var(--ink); background:#fff; flex:none}
.checks li.ok::before{background:#2fc77a}
.order-slots{display:grid; gap:8px; counter-reset:slot}
.slot{display:flex; gap:10px; align-items:center; min-height:48px; padding:8px 12px; border:3px dashed var(--ink-2); background:var(--paper-2); font-size:14px}
.slot::before{counter-increment:slot; content:counter(slot); font-family:var(--f-pixel); font-size:10px; width:26px; height:26px; flex:none; display:grid; place-items:center; background:var(--ink); color:#fff}

.pool{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.act-result{margin-top:18px; padding:16px; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); background:#fff}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:760px; margin:0 auto}
.qprog{display:flex; gap:4px; margin-bottom:18px}
.qprog i{flex:1; height:10px; border:2px solid var(--ink); background:var(--paper-2)}

.opt{display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:13px 14px; margin-bottom:10px; background:#fff; border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); color:var(--ink); font-size:15.5px}
.opt .k{flex:none; width:28px; height:28px; display:grid; place-items:center; font-family:var(--f-pixel); font-size:10px; background:var(--paper-2); border:2px solid var(--ink)}
.opt:hover:not([disabled]){background:#f4f1ff}
.opt.right{background:#c9f7de; border-color:#0b7a43} .opt.right .k{background:#2fc77a}
.opt.wrong{background:#ffd6db; border-color:#b3203a} .opt.wrong .k{background:#ff5d6e}
.opt[disabled]{cursor:default}
.result-hero{text-align:center; padding:12px 0}
.score-ring{width:150px; height:150px; margin:10px auto; display:grid; place-items:center; border:6px solid var(--ink); box-shadow:6px 6px 0 var(--ink); font-family:var(--f-title); font-size:56px}
.review{display:grid; gap:10px; margin-top:16px; text-align:left}
.review div{padding:12px; border:2px solid var(--ink); background:#fff; font-size:14px}
.review div.bad{background:#ffe1e5} .review div.ok{background:#e3fbef}

/* ---------- Challenge centre ---------- */
.ch-row{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:12px 14px; background:var(--panel); border:3px solid #000; box-shadow:3px 3px 0 #000}

.ch-row img{width:28px;height:28px}
.ch-row b{font-weight:600}
.ch-row small{display:block; color:var(--muted); font-size:12.5px}
@media (max-width:600px){ .ch-row{grid-template-columns:auto 1fr} .ch-row > :last-child{grid-column:1/-1} }
.boss{background:linear-gradient(120deg,#3b0d3a,#1b1460); border:3px solid #000; box-shadow:var(--hard); padding:22px; display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.boss h2{font-family:var(--f-title); font-size:36px; line-height:1}

/* ---------- Mentor ---------- */
.mentor-layout{display:grid; grid-template-columns:280px minmax(0,1fr); gap:20px}
@media (max-width:900px){ .mentor-layout{grid-template-columns:1fr} }
.mentor-card{background:linear-gradient(#2a1660,#170f43); border:3px solid #000; box-shadow:var(--hard); padding:20px; text-align:center}
.mentor-card img{width:96px; height:112px}
.mentor-card h2{font-family:var(--f-title); font-size:38px; line-height:1; color:#e2d0ff; margin-top:10px}
.chat{display:flex; flex-direction:column; background:#0b0e2a; border:3px solid #000; box-shadow:var(--hard); height:min(620px,72vh); min-height:420px}
.chat-head{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:3px solid #000; background:var(--panel)}
.chat-head .dot{width:10px;height:10px;background:var(--green); box-shadow:0 0 8px var(--green)}
.chat-log{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.msg{display:flex; gap:10px; align-items:flex-end; max-width:88%}
.msg .av{width:32px; height:32px; flex:none; background:#1b2160; border:2px solid #000; display:grid; place-items:center; overflow:hidden}
.msg .av img{width:24px; height:30px; margin-top:4px}
.msg .bubble{padding:10px 13px; border:2px solid #000; box-shadow:3px 3px 0 #000; font-size:14.5px; line-height:1.55; min-width:0; overflow-wrap:anywhere}
.msg .bubble p + p, .msg .bubble ul{margin-top:8px}
.msg .bubble ul{padding-left:18px; margin-bottom:0}
.msg.bot .bubble{background:#2a1a63; color:#f0e8ff}
.msg.me{align-self:flex-end; flex-direction:row-reverse}
.msg.me .bubble{background:var(--cyan); color:#04121a}
.msg .meta{font-family:var(--f-label); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:3px}
.msg.warn .bubble{background:#4a121c; color:#ffd0d6}
.typing span{display:inline-block; width:6px; height:6px; background:#d6bcff; margin-right:4px; animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.chat-input{display:flex; gap:8px; padding:10px; border-top:3px solid #000; background:var(--panel)}
.chat-input .input{flex:1; min-width:0}
.suggests{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px}
.suggests button{font-size:12.5px; padding:6px 10px; background:#22195a; border:2px solid #000; color:#e2d0ff; box-shadow:2px 2px 0 #000; text-align:left}
.suggests button:hover{background:#30237a}
.disclaimer{font-size:11.5px; color:var(--muted); padding:0 16px 10px}

.fab{position:fixed; right:max(18px, env(safe-area-inset-right,0px)); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:70; width:68px; height:68px; background:var(--purple); border:3px solid #000; box-shadow:var(--hard); display:grid; place-items:center; animation:bob 2.4s ease-in-out infinite}
.fab img{width:40px; height:46px}
.fab .bubble-hint{position:absolute; right:78px; bottom:16px; background:#fff; color:var(--ink); border:2px solid #000; box-shadow:3px 3px 0 #000; padding:6px 10px; font-size:12.5px; white-space:nowrap; font-family:var(--f-body)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.drawer{position:fixed; right:max(18px, env(safe-area-inset-right,0px)); bottom:calc(98px + env(safe-area-inset-bottom,0px)); z-index:71; width:min(400px, calc(100vw - 32px)); height:min(560px, calc(100vh - 170px))}

/* ---------- Community ---------- */
.comm-layout{display:grid; grid-template-columns:230px minmax(0,1fr) 220px; gap:16px}
@media (max-width:1050px){ .comm-layout{grid-template-columns:210px minmax(0,1fr)} .presence{display:none} }
@media (max-width:760px){ .comm-layout{grid-template-columns:1fr} }
.rooms{display:flex; flex-direction:column; gap:6px}
@media (max-width:760px){ .rooms{flex-direction:row; overflow-x:auto} }
.room{display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left; padding:10px 12px; background:var(--panel); border:2px solid #000; white-space:nowrap}
.room.on{background:var(--pink); color:#fff; box-shadow:3px 3px 0 #000}
.room small{font-family:var(--f-label); font-size:10px; opacity:.8}
.presence .who{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line-soft); font-size:13.5px}
.presence .who .av{width:30px;height:30px; background:#1b2160; border:2px solid #000; display:grid; place-items:center; overflow:hidden; position:relative; flex:none}
.presence .who .av img{width:22px; height:28px; margin-top:4px}
.status{width:9px; height:9px; border:1px solid #000; flex:none}
.status.on{background:var(--green)} .status.idle{background:var(--gold)} .status.off{background:#555c8a}
.cmsg{display:flex; gap:10px; align-items:flex-start; padding:4px 6px; position:relative}
.cmsg:hover{background:#ffffff08}
.cmsg .av{width:34px;height:34px; background:#1b2160; border:2px solid #000; display:grid; place-items:center; overflow:hidden; flex:none}
.cmsg .av img{width:26px; height:32px; margin-top:4px}
.cmsg .nm{font-weight:600; font-size:13.5px}
.cmsg.sys{background:#4a121c55; border:2px solid #000} .cmsg.sys .av{background:#4a121c} .cmsg.sys .nm{color:#ffb0b8}
.safety-panel{background:#2a1030}
.quote-box{background:#0b0f2c; border:2px solid #000; padding:10px; text-align:left; font-size:14px; margin:10px 0}
.cmsg .tm{font-family:var(--f-label); font-size:10px; color:var(--muted); margin-left:6px}
.cmsg .tx{font-size:14.5px; overflow-wrap:anywhere}
.cmsg .rep{position:absolute; right:6px; top:4px; opacity:0; background:var(--panel-2); border:2px solid #000; font-family:var(--f-label); font-size:10px; text-transform:uppercase; padding:3px 6px; color:var(--muted)}
.cmsg:hover .rep, .cmsg .rep:focus{opacity:1}
@media (hover:none){ .cmsg .rep{opacity:.8} }
.share-card{display:inline-flex; align-items:center; gap:10px; margin-top:6px; padding:8px 12px; background:#2b2408; border:2px solid #000; box-shadow:3px 3px 0 #000; color:var(--gold-ink)}
.share-card img{width:28px;height:28px}
.rules{font-size:12.5px; color:var(--muted); margin-top:14px; padding:12px; background:var(--panel); border:2px solid #000}

/* ---------- Achievements ---------- */
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.badge{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:16px 10px; background:var(--panel); border:3px solid #000; box-shadow:3px 3px 0 #000}
.badge .medal{width:64px; height:64px; display:grid; place-items:center; border:3px solid #000; box-shadow:3px 3px 0 #000; clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.badge .medal img{width:34px; height:34px}
.badge b{font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.06em}
.badge small{color:var(--muted); font-size:12px; line-height:1.35}
.badge.locked .medal{background:#20264f!important; filter:grayscale(1) brightness(.6)}
.badge.locked b{color:var(--muted)}
.level-card{display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center}
.level-num{width:110px; height:110px; display:grid; place-items:center; background:var(--gold); color:#000; border:4px solid #000; box-shadow:var(--hard); font-family:var(--f-title); font-size:68px}
.ladder{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
.ladder span{font-family:var(--f-label); font-size:10px; text-transform:uppercase; padding:3px 7px; border:2px solid #000; background:#0b0f2c; color:var(--muted)}
.ladder span.on{background:var(--gold); color:#000}
.history{display:grid; gap:0; font-size:14px}
.history div{display:grid; grid-template-columns:90px 1fr auto; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line-soft)}
.history span.t{font-family:var(--f-term); font-size:18px; color:var(--muted)}
.history span.x{font-family:var(--f-label); color:var(--gold-ink); font-size:12px}

/* ---------- Certificate ---------- */
.cert{background:#fffdf4; color:#1b1d3a; border:6px solid #1b1d3a; box-shadow:0 0 0 6px #ffd447, 0 0 0 12px #1b1d3a, 12px 12px 0 12px #000; padding:clamp(20px,5vw,48px); text-align:center; margin:16px; position:relative; overflow:hidden}
.cert::before{content:""; position:absolute; inset:12px; border:2px dashed #b9a24a; pointer-events:none}
.cert .c-logo{font-family:var(--f-title); font-size:clamp(30px,5vw,42px); letter-spacing:.04em; color:#1b1d3a; text-shadow:2px 2px 0 #ff4fae}
.cert .c-title{font-family:var(--f-label); font-size:clamp(14px,2.6vw,20px); letter-spacing:.2em; text-transform:uppercase; margin-top:18px; color:#5b45c9}

.cert .c-meta b{display:block; font-family:var(--f-label); text-transform:uppercase; font-size:11px; color:#5b45c9; letter-spacing:.08em}
.cert .seal{width:86px; height:86px; margin:18px auto 0}
.cert.preview{filter:grayscale(.85) blur(.4px); opacity:.6}
.cert .stamp{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.cert .stamp span{font-family:var(--f-title); font-size:clamp(30px,6vw,44px); color:#b3203a; border:5px solid #b3203a; padding:12px 18px; transform:rotate(-12deg); background:#fffdf4cc}
.checklist{display:grid; gap:10px}
.checklist div{display:flex; gap:12px; align-items:center; padding:12px; background:var(--panel); border:2px solid #000}
.checklist .box{width:24px;height:24px; flex:none; border:2px solid #000; display:grid; place-items:center; font-family:var(--f-pixel); font-size:10px; background:#0b0f2c}
.checklist .ok .box{background:var(--green); color:#000}

/* ---------- Admin ---------- */
.admin-banner{background:repeating-linear-gradient(45deg,#3a2a00 0 14px,#2a1e00 14px 28px); border:3px solid #000; padding:10px 14px; font-family:var(--f-label); text-transform:uppercase; letter-spacing:.08em; color:var(--gold-ink); margin-bottom:18px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:14px; min-width:560px}
.tbl th{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--muted); text-align:left; padding:8px; border-bottom:2px solid var(--line)}
.tbl td{padding:9px 8px; border-bottom:1px dashed var(--line-soft); font-variant-numeric:tabular-nums}
.range{width:100%; accent-color:var(--gold-ink)}

/* ---------- Modals / toasts ---------- */
.overlay{position:fixed; inset:0; z-index:200; background:#04061acc; display:grid; place-items:center; padding:16px; animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel); border:4px solid #000; box-shadow:0 0 0 3px var(--line), 10px 10px 0 3px #000; padding:24px; width:min(480px,100%); text-align:center; max-height:90vh; overflow:auto}
.modal h2{font-family:var(--f-title); font-size:36px; line-height:1; margin:12px 0 8px}
.modal .big-medal{width:110px; height:110px; margin:6px auto; display:grid; place-items:center; border:4px solid #000; box-shadow:4px 4px 0 #000; clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%); animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.modal .big-medal img{width:58px;height:58px}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}}
.modal .actions{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap}
.toasts{position:fixed; left:50%; transform:translateX(-50%); top:calc(76px + env(safe-area-inset-top,0px)); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:calc(100% - 32px); max-width:480px}
.toast{background:#0b0f2c; border:3px solid #000; box-shadow:4px 4px 0 #000; padding:10px 14px; font-size:14px; display:flex; gap:10px; align-items:center; animation:slide .25s}
.toast.xp{background:var(--gold); color:#000; font-family:var(--f-pixel); font-size:11px}
@keyframes slide{from{transform:translateY(-12px); opacity:0}}
.menu{position:fixed; right:max(16px, env(safe-area-inset-right,0px)); top:calc(68px + env(safe-area-inset-top,0px)); z-index:120; width:290px; background:var(--panel); border:3px solid #000; box-shadow:var(--hard); padding:12px}
.menu .label{color:var(--gold-ink); display:block; margin:6px 4px 8px}
.menu button.item{display:block; width:100%; text-align:left; padding:9px 10px; background:transparent; border:2px solid transparent; font-size:14px}
.menu button.item:hover{background:var(--panel-2); border-color:#000}
.menu hr{border:0; border-top:2px dashed var(--line); margin:8px 0}

@media (max-width:760px){
  .hud{flex-wrap:wrap; gap:10px}
  .nav{order:3; flex-basis:100%}
  .player-chip .xpwrap{display:none}
  .logo{font-size:12px}
  .page-head h1{font-size:34px}
  .logo{font-size:24px}
  .monitor{padding:18px; margin:6px}
  .fab .bubble-hint{display:none}
  .campus-hud{display:none}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

/* ---------- Title screen and onboarding pages ----------

.onb{position:fixed; inset:0; overflow:hidden; background:#05071c}
#onbSky{position:absolute; inset:0; width:100%; height:100%; display:block}
.onb-pages{position:absolute; inset:0}
.onb-page{position:absolute; inset:0; overflow-y:auto; display:grid; place-items:center; transition:transform .7s cubic-bezier(.65,0,.35,1);

.onb-page.from-below, .onb-page.to-below{transform:translateY(100%)}
.onb-page.from-above, .onb-page.to-above{transform:translateY(-100%)}
.onb-page:not(.step-title){background:linear-gradient(180deg, transparent 0, #05071c55 30%, #05071c88 100%)}
[data-theme="day"] .onb-page:not(.step-title){background:linear-gradient(180deg, transparent 0, #ffffff33 30%, #ffffff55 100%)}

.title-screen{display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; margin-top:-22vh}
.ts-kicker{font-family:var(--f-label); font-size:clamp(11px,1.6vw,14px); text-transform:uppercase; letter-spacing:.14em; color:#fff; text-shadow:2px 2px 0 #000, -1px -1px 0 #000}
.step-title .hero-logo{font-size:clamp(84px,17vw,190px); line-height:.9; white-space:nowrap}
.step-title .hero-tag{margin-top:6px; color:#fff; text-shadow:2px 2px 0 #000, -1px -1px 0 #000}
.press-start{margin-top:26px; font-family:var(--f-title); font-size:clamp(30px,4.4vw,44px); letter-spacing:.08em; text-transform:uppercase; padding:6px 30px 10px;
  background:var(--pink); color:#fff; border:4px solid #000; box-shadow:0 0 0 3px #fff, 7px 7px 0 3px #000; animation:pressPulse 1.2s steps(2) infinite}
.press-start:hover, .press-start:focus-visible{animation:none; background:var(--gold); color:#000}
.press-start:active{transform:translate(4px,4px); box-shadow:0 0 0 3px #fff, 3px 3px 0 3px #000}
@keyframes pressPulse{50%{color:var(--ps-pulse, var(--gold)); background:var(--ps-bg2, #c4237d)}}
.ts-hint{font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:#fff; text-shadow:2px 2px 0 #000; opacity:.9}
.ts-foot{position:absolute; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px)); text-align:center; font-family:var(--f-label); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#fff; text-shadow:2px 2px 0 #000}

.onb-card{width:min(440px,100%); display:grid; gap:12px}
.onb-top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.onb-top .label{color:#fff; text-shadow:2px 2px 0 #000}
.onb-back{font-family:var(--f-label); font-size:12px; text-transform:uppercase; letter-spacing:.06em; padding:6px 10px; background:#0b0f2ce6; color:#e9ecff; border:2px solid #000; box-shadow:2px 2px 0 #000}
.onb-logo{font-family:var(--f-title); font-size:64px; line-height:1; text-align:center; letter-spacing:.04em; color:#fff}
.onb-sub{text-align:center; color:#fff; text-shadow:2px 2px 0 #000; font-size:15px}
.onb-wide{width:min(900px,100%)}
.step-brief .briefing{background:none}
[data-theme="day"] .press-start{background:#6cc24a; color:#16300c} [data-theme="day"] .press-start{--ps-pulse:#16300c; --ps-bg2:#ffd447}
@media (max-width:560px){ .title-screen{margin-top:-16vh} .onb-logo{font-size:52px} .press-start{padding:6px 22px 9px} }

/* ---------- Campus tour with BYTE (11-tutorial.js) ----------
   RPG dialogue box at the bottom, a spotlight that dims everything but the building or control being explained,
   and a bouncing arrow. Sits above the top bar; pop-ups and toasts stay above it. */
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.tour{position:fixed; inset:0; z-index:150; cursor:pointer}
.tour-dim{position:absolute; inset:0; background:#05061a99; transition:opacity .3s}
.tour.has-spot .tour-dim{opacity:0}
.tour-spot{position:fixed; pointer-events:none; border:3px solid var(--gold); box-shadow:0 0 0 3px #000, 0 0 0 200vmax #05061a9e, 0 0 26px 6px #ffd44788 inset;
  animation:spotPulse 1.2s steps(2) infinite}
@keyframes spotPulse{50%{border-color:#fff}}
.tour-arrow{position:fixed; transform:translateX(-50%); font-family:var(--f-title); font-size:34px; line-height:1; color:var(--gold); text-shadow:3px 3px 0 #000, -2px -2px 0 #000; pointer-events:none; animation:arrowBob .6s steps(2) infinite}
.tour-arrow.up{transform:translateX(-50%) rotate(180deg)}

.tour-box{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:min(760px, calc(100% - 24px));
  display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:start; padding:16px 18px 18px; cursor:default;
  background:#0b0f2c; color:#e9ecff; border:4px solid #fff; box-shadow:0 0 0 4px #000, 8px 8px 0 4px #000; animation:tourIn .35s steps(5)}

@keyframes tourIn{from{transform:translate(-50%,40px); opacity:0}}
.tour-portrait{width:92px; height:104px; display:grid; place-items:center; background:radial-gradient(circle at 50% 60%, #3a2a8c 0%, #151a4d 70%); border:3px solid #000; box-shadow:inset 0 0 0 3px #5d2fb0}
.tour-portrait canvas{width:70px; height:80px; image-rendering:pixelated}
.tour-name{font-family:var(--f-title); font-size:28px; line-height:1; color:var(--gold); letter-spacing:.04em; text-shadow:2px 2px 0 #000}
.tour-name span{font-family:var(--f-label); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#b9a3ff; margin-left:8px; text-shadow:none}
.tour-text{margin-top:8px; font-size:17px; line-height:1.5; min-height:3em; max-width:62ch}
.tour-choices{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.tour-choices:empty{display:none}

.tour-tool:hover{background:#5d2fb0}
.tour-tool[aria-pressed="true"]{background:#0f3e2b; color:var(--green)}
[data-theme="day"] .tour-dim{background:#1d3a6680}
[data-theme="day"] .tour-spot{box-shadow:0 0 0 3px #000, 0 0 0 200vmax #1d3a6673, 0 0 26px 6px #ffd44788 inset}
[data-theme="day"] .tour-box{background:#fffaf0; color:#2b2340; border-color:#5b2f1c}
[data-theme="day"] .tour-name{color:#ffd23f; text-shadow:2px 0 #5b2f1c, -2px 0 #5b2f1c, 0 2px #5b2f1c, 0 -2px #5b2f1c}
[data-theme="day"] .tour-name span{color:#6a38c9}
[data-theme="day"] .tour-portrait{background:radial-gradient(circle at 50% 60%, #e9dcff 0%, #bfe7ff 70%)}
[data-theme="day"] .tour-next{color:#9a6400}
@media (max-width:560px){
  .tour-box{grid-template-columns:62px minmax(0,1fr); gap:10px; padding:14px 12px 16px}
  .tour-portrait{width:62px; height:72px} .tour-portrait canvas{width:49px; height:56px}
  .tour-name{font-size:24px} .tour-text{font-size:15px} .tour-tools{right:8px}
}

/* ---------- Cyber Arcade (12-arcade.js) ----------
   Hall: one pixel cabinet per game plus a sample leaderboard. Game page: a dark arcade cabinet with HUD,
   question bar, canvas screen, intro/results overlays and on-screen buttons on phones. */
.arcade-hall{display:grid; gap:18px; margin-bottom:8px}

.machine{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:16px 14px; background:var(--panel); border:3px solid #000; border-top:6px solid var(--mc); box-shadow:var(--hard)}

.lb-list{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.lb-list li{display:grid; grid-template-columns:28px 30px minmax(0,1fr) auto; gap:10px; align-items:center; padding:6px 10px; background:var(--navy); border:2px solid #000}
.lb-list li.me{background:#4a3b0b; border-color:var(--gold)}
.lb-rank{font-family:var(--f-title); font-size:22px; color:var(--gold-ink); text-align:center}
.lb-list img{width:26px; height:30px}
.lb-name{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.arc-cab{max-width:min(900px, calc((100vh - 190px) * 1.6)); min-width:min(100%, 560px); margin:0 auto; padding:12px; background:linear-gradient(#1b2054,#0b0f2c); border:4px solid #000; box-shadow:0 0 0 3px var(--mc), 8px 8px 0 3px #000; color:#e9ecff}

.arc-score{font-family:var(--f-label); font-size:12px; letter-spacing:.08em}
.arc-score b{font-family:var(--f-title); font-size:30px; color:var(--gold); margin-left:6px; font-variant-numeric:tabular-nums}
.arc-q{flex:1 1 320px; text-align:center; font-family:var(--f-title); font-size:28px; line-height:1.05; letter-spacing:.02em; color:#fff; background:#05061a; border:3px solid var(--mc); padding:6px 12px}
.arc-q small{display:block; font-family:var(--f-label); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mc); margin-bottom:2px}
.arc-lives{display:flex; gap:4px}
.arc-lives i{display:block; width:18px; height:16px; background:#3a4166; clip-path:polygon(50% 100%,0 45%,0 18%,18% 0,35% 0,50% 18%,65% 0,82% 0,100% 18%,100% 45%)}
.arc-lives i.on{background:#ff4fae}
.arc-screen{position:relative; border:3px solid #000; background:#05061a}
.arc-screen canvas{display:block; width:100%; height:auto; aspect-ratio:16/10}
.arc-over{position:absolute; inset:0; display:grid; place-items:center; padding:14px; overflow:auto; background:#05061ae0}
.arc-card{width:min(600px,100%); display:grid; gap:12px; justify-items:center; text-align:center}
.arc-card p{color:#c3c9ee; max-width:52ch}
.arc-title{font-family:var(--f-title); font-size:clamp(42px,7vw,68px); line-height:.95; letter-spacing:.04em; color:var(--mc); text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,0 7px #000}

.arc-controls{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}

.arc-diffs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; width:100%}
.arc-diffs button{display:grid; gap:2px; padding:8px; background:#1f2766; color:#e9ecff; border:3px solid #000; box-shadow:2px 2px 0 #000}

.arc-start{font-size:16px; padding:12px 30px}

@media (max-width:640px){

}
[data-theme="day"] .arc-cab{--cyan-ink:var(--cyan); --gold-ink:var(--gold); --green-ink:var(--green); --pink-ink:var(--pink); --red-ink:var(--red); --text:#e9ecff; --muted:#9aa3da}

/* Virus Escape and the incident banner */

.arc-story{color:#ffd6db!important; font-weight:600; background:#3a0d1a; border:2px solid #ff5d6e; padding:8px 12px}

/* ---------- App shell: sidebar, top bar, phone tab bar (Phase 1 layout) ---------- */
.shell{--side-w:212px; --tab-h:0px; padding-left:var(--side-w); padding-bottom:var(--tab-h); min-height:100%}
.shell.mini{--side-w:78px}

.hud-spacer{flex:1}

.bell-pop{position:fixed; right:max(16px, env(safe-area-inset-right,0px)); top:calc(64px + env(safe-area-inset-top,0px)); z-index:130; width:min(320px, calc(100% - 32px)); padding:12px; display:grid; gap:6px; background:var(--panel); border:3px solid #000; box-shadow:var(--hard)}

.tabbar{display:none}

@media (max-width:760px){
